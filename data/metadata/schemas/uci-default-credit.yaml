# Documented schema for uci-default-credit, transcribed from the UCI API
# (archive.ics.uci.edu/api/dataset?id=350) on 2026-07-23. Used only to
# detect divergence between "the file we got" and "what UCI documents" -
# see credlens.data.schema and docs/data_quality_audit.md.

source_id: uci-default-credit

columns:
  - name: ID
    description: "Row identifier assigned by UCI (index column, not part of the original 23 explanatory variables)."
    expected_type: integer
  - name: X1
    description: "LIMIT_BAL - amount of the given credit (NT dollar), including individual and family (supplementary) credit."
    expected_type: integer
  - name: X2
    description: "SEX - gender (1 = male; 2 = female)."
    expected_type: categorical
  - name: X3
    description: "EDUCATION (1 = graduate school; 2 = university; 3 = high school; 4 = others)."
    expected_type: categorical
  - name: X4
    description: "MARRIAGE - marital status (1 = married; 2 = single; 3 = others)."
    expected_type: categorical
  - name: X5
    description: "AGE in years."
    expected_type: integer
  - name: X6
    description: "PAY_0 - repayment status in September 2005 (-1 = pay duly; 1 = delay 1 month; ... 9 = delay 9+ months)."
    expected_type: categorical
  - name: X7
    description: "PAY_2 - repayment status in August 2005 (same scale as X6)."
    expected_type: categorical
  - name: X8
    description: "PAY_3 - repayment status in July 2005 (same scale as X6)."
