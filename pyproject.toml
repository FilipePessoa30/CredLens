[project]
name = "credlens"
version = "0.2.0"
description = "CredLens - Credit Risk & Portfolio Analytics. Project scaffolding, business framing, a CLI, and reproducible public-dataset acquisition/audit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CredLens contributors" }]
keywords = ["credit-risk", "analytics", "portfolio", "fintech", "data"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]

# Runtime dependencies are kept intentionally minimal. Phase 1 needed only
# PyYAML (config). Phase 2 (data acquisition/audit) justifies two additions:
# requests (HTTP downloads with retries/timeouts) and pandas (reading the
# original tabular formats and computing structural audit statistics).
dependencies = [
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "pandas>=2.2,<3",
]

[project.urls]
Repository = "https://github.com/OWNER/credlens-credit-analytics"

[project.scripts]
credlens = "credlens.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
  "types-requests>=2.31,<3",
  "responses>=0.25,<1",
  "pandas-stubs>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credlens"]

# --- Pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --cov=credlens --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/credlens"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "N",   # pep8-naming
  "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["credlens"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["credlens"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
