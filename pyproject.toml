[project]
name = "credlens"
version = "1.0.0rc2"
description = "CredLens - Credit Risk & Portfolio Analytics. Project scaffolding, business framing, a CLI, reproducible public-dataset acquisition/audit, conceptual data model, data contracts, a deterministic, performance-optimized synthetic-portfolio generator with counterfactual scenarios and common random numbers, a DuckDB + dbt analytical warehouse with a dimensional schema, SQL KPIs, and quality tests, a reproducible portfolio-analysis layer with bilingual reporting, a Streamlit decision-intelligence dashboard with a verifiable insights registry and a versioned demo package, an interpretable behavioral early-warning default model trained and validated on the real UCI Default of Credit Card Clients benchmark, an independent model-validation and monitoring-simulation layer that recomputes evidence from frozen artifacts, audits multicollinearity/subgroup gaps/negative controls, formalizes a challenger model, and simulates monitoring batches over that same public benchmark, and a 1.0 release-candidate pass that recalibrated monitoring's false-alert rate, added a governed reason-code policy and a signal/alert/incident escalation hierarchy, registered a separately-validated remediated model variant, and added offline release-engineering tooling (license inventory, SBOM, deterministic release manifest)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CredLens contributors" }]
keywords = ["credit-risk", "analytics", "portfolio", "fintech", "data"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]

# Runtime dependencies are kept intentionally minimal. Phase 1 needed only
# PyYAML (config). Phase 2 (data acquisition/audit) added requests (HTTP
# downloads) and pandas (tabular reading + audit statistics). Phase 3 (data
# contracts) adds pydantic: contract YAML files are structurally complex
# (nested column/domain/foreign-key/rule specs across 20 contracts) and
# pydantic gives typed parsing with precise validation errors for a fraction
# of the hand-written validation code the Phase 1/2 dataclass-based pattern
# would need here - see docs/data_contracts.md. Actual DATA rows are still
# validated with vectorized pandas operations, not per-row Pydantic models
# (see docs/adr/0006-audit-vs-strict-validation.md). Phase 4A (the baseline
# synthetic generator) adds two more: numpy, for np.random.SeedSequence-based
# reproducible, independently-derived RNG substreams per generation step (see
# docs/synthetic_generation_implementation.md) - pandas alone has no
# equivalent substream mechanism; and pyarrow, so pandas can write/read
# Parquet (the columnar, typed output format generated tables use) without
# depending on a full analytical engine (DuckDB, etc.) this phase doesn't
# need. Neither is used for modeling - no scikit-learn/XGBoost/LightGBM/SHAP
# is added, per this phase's explicit scope. Phase 4B (performance
# optimization, counterfactual scenarios, common random numbers, Monte Carlo,
# quarantine) adds NO new dependencies - everything is built on numpy/pandas/
# pydantic/pyarrow already present, plus the Python standard library
# (cProfile, tracemalloc, statistics, ast).
dependencies = [
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.6,<3",
  "numpy>=1.26,<3",
  "pyarrow>=16,<19",
]

[project.urls]
Repository = "https://github.com/OWNER/credlens-credit-analytics"

[project.scripts]
credlens = "credlens.cli:main"

# Phase 5's warehouse (DuckDB + dbt) is deliberately an OPTIONAL extra, not
# a core runtime dependency: nothing in credlens.generation or the contracts
# layer needs it, only `credlens warehouse ...` and the warehouse/ dbt
# project do. dbt-core/dbt-duckdb pull in a large, fast-moving dependency
# tree (jinja2, protobuf, sqlglot, networkx, ...) that would otherwise
# bloat every install of the base package. Versions were resolved by `uv
# add --optional warehouse dbt-core dbt-duckdb` (not hand-picked) and are
# pinned exactly in uv.lock; `dbt-duckdb==1.10.1` itself pulls in
# `duckdb==1.5.5`, the actual DuckDB engine version this phase was built
# and tested against. Install with `uv sync --extra warehouse`.
[project.optional-dependencies]
warehouse = [
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.10.1",
]
# Phase 6's portfolio-analysis layer (credlens.analysis) needs a plotting
# library to produce the required visualizations (funnel, PAR curves, roll
# rate heatmap, vintage curves, ...) - matplotlib only, not a full
# notebook/Jupyter stack, since figures are generated by CLI-invoked code,
# not interactively. Version resolved via `uv add --optional analysis
# matplotlib`, pinned in uv.lock. Install with `uv sync --extra analysis`
# (combine with `--extra warehouse` for the full `credlens analysis` CLI,
# which reads from a warehouse build).
analysis = [
    "matplotlib>=3.11.1",
]
# Phase 7's case-study notebook (notebooks/credit_portfolio_case_study.ipynb)
# is a thin, read-only viewer over reports/portfolio_analysis/ - it needs a
# real Jupyter kernel to execute end-to-end (not just to be opened by a
# reader's own environment), which the base/analysis extras deliberately do
# not pull in (Phase 6 kept the analysis CLI notebook-free). Version resolved
# via `uv add --optional notebook jupyter nbconvert ipykernel`, pinned in
# uv.lock. Install with `uv sync --extra analysis --extra notebook`.
notebook = [
    "jupyter>=1.1.1",
    "nbconvert>=7.16.6",
    "ipykernel>=6.30.1",
]
# Phase 7's Streamlit dashboard (dashboard/, src/credlens/dashboard/) is a
# thin PRESENTATION layer over already-validated marts/reports - Streamlit
# and its interactive-plotting dependency are deliberately an optional
# extra, never a core runtime dependency, for the same reason warehouse/
# analysis are optional: a large, fast-moving dependency tree that would
# otherwise bloat every install of the base package. Version resolved via
# `uv add --optional dashboard streamlit plotly`, pinned in uv.lock. Install
# with `uv sync --extra warehouse --extra analysis --extra dashboard`.
dashboard = [
    "streamlit>=1.51.0",
    "plotly>=6.0.0",
    "kaleido>=0.2.1",
]
# Phase 8's behavioral-default modeling layer (credlens.modeling) needs a
# real modeling stack - scikit-learn (estimators, preprocessing, model
# selection, calibration, permutation importance/partial dependence) and
# threadpoolctl (recording the actual thread count HistGradientBoosting-
# Classifier's OpenMP backend uses, since it exposes no n_jobs parameter
# of its own - see credlens.modeling.tuning). scipy/joblib arrive
# transitively via scikit-learn and are not pinned separately. No
# MLflow/Optuna/XGBoost/LightGBM/SHAP: HistGradientBoostingClassifier
# (already in scikit-learn) is the challenger, permutation importance +
# partial dependence (also already in scikit-learn) stand in for SHAP -
# see reports/modeling/technical_report.md for why. Version resolved via
# `uv add --optional modeling scikit-learn threadpoolctl`, pinned in
# uv.lock. Install with `uv sync --extra analysis --extra modeling`.
#
# Phase 9's independent-validation/monitoring layers (credlens.
# model_validation, credlens.monitoring) add NO new dependency of their
# own - they reuse this same extra (scikit-learn's LinearRegression for
# VIF, scipy.optimize/scipy.stats/scipy.spatial for the independent
# calibration/discrimination/drift math, matplotlib via the analysis
# extra for figures).
modeling = [
    "scikit-learn>=1.5.0",
    "threadpoolctl>=3.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
  "types-requests>=2.31,<3",
  "responses>=0.25,<1",
  "pandas-stubs>=2.2,<3",
  "selenium>=4.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credlens"]

# --- Pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --cov=credlens --cov-report=term-missing --cov-report=xml"
markers = [
    "slow: exercises the full Phase 8 modeling pipeline on the real 30k-row UCI benchmark (tuning/bootstrap/robustness) - deselect with -m 'not slow' for a fast smoke path; CI's main job runs the full suite regardless.",
]

[tool.coverage.run]
source = ["src/credlens"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "N",   # pep8-naming
  "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["credlens"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["credlens"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# plotly and streamlit (Phase 7 dashboard extra) ship no inline type
# annotations/py.typed marker - dashboard code that calls into them is
# still checked itself, only the third-party call boundary is silenced.
[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*"]
ignore_missing_imports = true

# scikit-learn (Phase 8 modeling extra) ships no py.typed marker either.
[[tool.mypy.overrides]]
module = ["sklearn.*", "threadpoolctl.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true
