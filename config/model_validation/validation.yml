# CredLens - Phase 9 independent validation configuration.
#
# Every numeric knob the independent validation layer (src/credlens/
# model_validation/) needs lives here, versioned separately from Phase 8's
# config/modeling/evaluation.yml - this is deliberate: the validation
# layer must be able to change its own tolerances/thresholds without
# touching the training-time config it is auditing.

validation_config_version: "1.0.0"

# credlens.model_validation.recomputation - independent re-derivation of
# discrimination/calibration/threshold metrics from FROZEN predictions.
# Tolerances are tight (these are the SAME predictions, recomputed with an
# independent implementation - divergence should be floating-point noise,
# not a real disagreement).
recomputation:
  metric_absolute_tolerance: 0.0005
  stability_absolute_tolerance: 0.0005
  # Operating-point thresholds depend on which exact score value is
  # picked at a quantile/recall boundary - an independent implementation
  # using a different tie-breaking/interpolation convention (order-
  # statistic indexing here vs. numpy.quantile's linear interpolation in
  # credlens.modeling.thresholds) legitimately lands on a slightly
  # different threshold, shifting recall/precision by a small amount.
  # This is expected quantization noise, not a computation bug - see
  # Phase 9 section 11's own note about ties/quantiles - so it gets a
  # looser, separately documented tolerance than exact metric recomputation.
  operating_point_tolerance: 0.003
  # The out_of_domain_delinquency_code robustness perturbation draws its
  # own random corruption mask - an independent re-derivation with a
  # freshly seeded RNG will not match Phase 8's exact random rows (whose
  # RNG state had already advanced through several earlier perturbations
  # in the same run), so it needs a looser, magnitude-only tolerance.
  # delinquency_worsening is fully deterministic (no randomness) and uses
  # the tight metric_absolute_tolerance above instead.
  robustness_stochastic_tolerance: 0.08

# credlens.model_validation.negative_controls - Phase 10 gate A replaced
# the single Phase 9 pipeline-retrain-only test (and its fixed
# |mean-0.5|<=0.05 band) with TWO distinct, complementary controls, since
# auditing the Phase 9 null distribution (mean=0.4907, std=0.0631,
# range=[0.329, 0.675]) found no alignment/indexing/seeding bug - the
# width is the EXPECTED, textbook consequence of retraining-based
# permutation nulls carrying model-refitting variance on top of label-
# shuffling variance. A parallel score-label-only control (frozen scores,
# label permutation only) empirically confirms this: same data, same
# frozen model, observed std=0.00883 against a theoretical closed-form SE
# of 0.00898 (ratio 0.98) - i.e. textbook-tight, exactly as expected for
# that DIFFERENT kind of test. Reporting both, side by side, replaces one
# ambiguous number with two well-understood ones.
permutation_test:
  # Control 1 - score-label permutation (Phase 10 section 5.2): the
  # ALREADY-FITTED model's frozen validation predictions are re-used
  # unchanged; only the validation LABELS are permuted. No retraining -
  # a classical, exact-reference-distribution permutation test whose
  # variance has a closed-form theoretical prediction (see
  # permutation_audit.theoretical_null_auc_se), checked directly against
  # the observed standard deviation rather than an arbitrary band.
  control1_score_label:
    n_permutations_full: 999
    n_permutations_ci: 99
    base_seed: 20260728
    alpha: 0.01
  # Control 2 - full pipeline retrain (Phase 9's original control,
  # preserved): the TRAINING target is permuted, the pipeline is refit
  # from scratch, and scored on the untouched validation set. Legitimately
  # wider variance than Control 1 - no closed-form SE exists for it, so no
  # amplitude check is applied; only structural/centering checks are.
  # n_permutations_ci was raised from 10 to 99 in Phase 10 gate B: a
  # timed measurement on the real 30,000-row UCI benchmark showed a full
  # retrain-permutation costs ~0.036s (20 permutations in 0.73s), so 99
  # permutations cost well under 4 seconds - cheap enough to run for real
  # in CI. At n=10 the smallest achievable empirical p-value was 1/11 ~
  # 0.09, which can NEVER satisfy alpha=0.01 - that is why CI previously
  # had to mask this gate's failure with `|| true`. At n=99 the smallest
  # achievable p-value is 1/100 = 0.01, exactly satisfying `p <= alpha`,
  # so CI can now genuinely pass or fail this gate instead of it being
  # mathematically unwinnable.
  control2_pipeline_retrain:
    n_permutations_full: 100
    n_permutations_ci: 99
    base_seed: 20260728
    alpha: 0.01
  # Principled statistical checks - Phase 10 section 5.3 explicitly rules
  # out "uma tolerância fixa arbitrária". Centering is a two-sided z-test
  # of the null distribution's OWN mean against 0.5, using the null
  # distribution's OWN standard error of the mean (std / sqrt(n)) - this
  # self-calibrates to however many permutations were actually run, never
  # a fixed absolute number. Amplitude is only evaluated for Control 1
  # (which has a closed-form expected SE); it is the ratio of the
  # observed standard deviation to that theoretical SE.
  centering_sigma_multiplier: 3.0
  amplitude_se_ratio_min: 0.3333333333333333
  amplitude_se_ratio_max: 3.0

# credlens.model_validation.collinearity / coefficient_audit
collinearity:
  vif_flag_threshold: 5.0
  vif_action_threshold: 10.0
  high_correlation_threshold: 0.70
  condition_number_flag_threshold: 15.0
  condition_number_action_threshold: 30.0
  coefficient_bootstrap_n_resamples: 200
  coefficient_bootstrap_seed: 20260728
  cv_folds_for_stability: 5
  regularization_sensitivity_grid: [0.01, 0.1, 1.0, 10.0]
  sign_flip_rate_unstable_threshold: 0.05
  low_magnitude_odds_ratio_band: [0.95, 1.05]

# credlens.model_validation.subgroup_validation
subgroup_bootstrap:
  n_resamples: 500
  seed: 20260728
  percentiles: [2.5, 50, 97.5]

# credlens.model_validation.decision - validation gates (Phase 9 section
# 19). Every gate is independently evaluated here, never copied from the
# Phase 8 registration gate report.
gates:
  max_recomputation_metric_divergence: 0.0005
  min_test_roc_auc: 0.60
  min_pr_auc_uplift_over_dummy: 0.03
  permutation_alpha: 0.01
  max_calibration_brier_divergence: 0.0005
  max_split_stability_roc_auc_stdev: 0.02
  vif_action_threshold: 10.0
  max_subgroup_selection_rate_gap: 0.30
  max_robustness_pr_auc_degradation_without_flag: 0.20
  require_artifact_hash_match: true
  require_reproducibility_match: true
  require_documentation_complete: true

# credlens.model_validation.remediation - Phase 10 gate D decision
# thresholds for the post-validation remediated regression
# (EXP_behavioral_default_v2_reduced / MODEL_behavioral_default_v2_reduced).
# `remediation_candidate` is the MOST favorable outcome this decision can
# reach - never a promotion gate, never validation_passed/candidate/
# production. Improvement bounds exist because remediation only removes
# redundant/unstable coefficients (adds no new information) - an
# implausibly large gain over v1 is a red flag given gate C's disclosure
# that this frozen test set has been repeatedly observed across Phases
# 8-10, not evidence of a better model.
remediation:
  max_vif_action_threshold: 10.0
  max_kept_feature_sign_flip_rate: 0.05
  max_pr_auc_degradation_vs_v1: 0.02
  max_pr_auc_suspicious_improvement_vs_v1: 0.03
  max_roc_auc_degradation_vs_v1: 0.02
  max_roc_auc_suspicious_improvement_vs_v1: 0.03

# credlens.model_validation.challenger_review - candidate/challenger
# Pareto comparison axes (Phase 9 section 8.1). Purely descriptive - no
# axis here decides eligibility on its own.
pareto_axes:
  - pr_auc
  - roc_auc
  - brier_score
  - log_loss
  - ks_statistic
  - calibration_slope
  - split_stability_roc_auc_stdev
  - max_robustness_pr_auc_degradation
  - max_subgroup_selection_rate_gap
  - artifact_size_bytes
  - scoring_latency_ms
  - explainability_tier
