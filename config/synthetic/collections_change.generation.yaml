# CredLens - collections_change scenario executable generation configuration.
#
# Phase 4B counterfactual: a synthetically more intensive/effective
# collections strategy relative to baseline.generation.yaml. Only
# collections/cure/recovery parameters change:
#   - collections.contact_dpd_thresholds: lower (earlier, more contacts)
#   - collections.promise_to_pay_probability: higher
#   - payment_behavior.cure_probability_per_month: higher
#   - recovery.recovery_probability / recovery_fraction_*: higher
#
# cure_probability_per_month is ONLY ever read inside the has_backlog
# branch of credlens.generation.payments._decide_payment_amount - i.e.
# only for a contract that ALREADY has an overdue installment, which by
# construction is already collections-eligible (see should_contact() in
# credlens.generation.collections). So origination, decisions, contracts,
# schedules, AND every payment made before a contract first falls behind
# are governed by on_time_probability/partial_payment_probability/
# prepayment_probability, none of which this scenario touches - those
# stay byte-identical to baseline, satisfying section 9's "no change
# before collections eligibility" invariant without any code change,
# purely from this config difference. See docs/counterfactual_scenarios.md.
#
# Every other field is BYTE-IDENTICAL to baseline.generation.yaml, required
# for CRN (docs/common_random_numbers.md).

version: 1
scenario: collections_change
default_seed: 2026
currency_unit: credlens_synthetic_unit

period:
  start: 2024-01-01
  end: 2024-12-31

scales:
  smoke:
    customers: 200
    description: "Fast, deterministic sanity-check scale - same population as baseline's smoke, per CRN."
  sample:
    customers: 5000
    description: "Same population as baseline's sample, per CRN."
  portfolio:
    customers: 50000
    description: "Same population as baseline's portfolio, per CRN - not executed automatically."

population:
  declared_income_min: 800
  declared_income_max: 15000
  employment_months_max: 240
  existing_relationship_share: 0.3
  bureau_score_bucket_weights:
    thin_file: 0.15
    low: 0.25
    medium: 0.35
    high: 0.25

applications:
  applications_per_customer_max: 2
  channel_weights:
    app: 0.40
    web: 0.30
    branch: 0.15
    partner: 0.15
  requested_amount_min: 300
  requested_amount_max: 8000
  requested_term_months_choices: [3, 6, 12, 18, 24]
  cancellation_rate: 0.05

policy:
  approval_score_cutoff: 0.5
  offered_rate: 0.035
  approved_term_months_max: 24

booking:
  booking_rate_given_approved: 0.85
  max_days_approval_to_contract: 10

contract:
  max_days_contract_to_disbursement: 2

payment_behavior:
  on_time_probability: 0.70
  partial_payment_probability: 0.12
  prepayment_probability: 0.05
  # Raised from baseline's 0.20 - the ONLY payment_behavior field this
  # scenario changes, and it only ever applies to already-delinquent
  # (collections-eligible) contracts - see the module docstring above.
  cure_probability_per_month: 0.38
  reversal_rate: 0.01
  allocation_order: [fees, interest, principal]

collections:
  # Earlier/more frequent contact than baseline's [15, 45, 75].
  contact_dpd_thresholds: [7, 25, 55]
  # Raised from baseline's 0.35.
  promise_to_pay_probability: 0.55

write_off:
  dpd_threshold: 150

recovery:
  # Raised from baseline's 0.25 / 0.05 / 0.40.
  recovery_probability: 0.45
  recovery_fraction_min: 0.10
  recovery_fraction_max: 0.55
  max_months_after_write_off: 6

tolerance:
  monetary_tolerance: 0.01

output:
  format: parquet
  operational_dir: data/synthetic
  truth_dir: data/synthetic_truth
