# CredLens - macroeconomic_stress scenario executable generation configuration.
#
# Phase 4B counterfactual: a dated, documented synthetic payment-behavior
# shock, applied from macro_shock.shock_date onward. Everything BEFORE
# that date - population, applications, features, fairness, truth,
# decisions, contracts, schedules, and payment behavior - is
# byte-identical to baseline for the same seed (see
# credlens.generation.payments._effective_payment_behavior, which only
# substitutes a shocked payment_behavior for months >= shock_date).
# macro_context_monthly gains additional rows for the shock itself
# (source_type=synthetic_shock, is_synthetic=true) - the
# real BCB rows already present in baseline are never modified or
# removed, see docs/counterfactual_scenarios.md.
#
# Every field except macro_shock is BYTE-IDENTICAL to
# baseline.generation.yaml, required for CRN (docs/common_random_numbers.md).

version: 1
scenario: macroeconomic_stress
default_seed: 2026
currency_unit: credlens_synthetic_unit

period:
  start: 2024-01-01
  end: 2024-12-31

scales:
  smoke:
    customers: 200
    description: "Fast, deterministic sanity-check scale - same population as baseline's smoke, per CRN."
  sample:
    customers: 5000
    description: "Same population as baseline's sample, per CRN."
  portfolio:
    customers: 50000
    description: "Same population as baseline's portfolio, per CRN - not executed automatically."

population:
  declared_income_min: 800
  declared_income_max: 15000
  employment_months_max: 240
  existing_relationship_share: 0.3
  bureau_score_bucket_weights:
    thin_file: 0.15
    low: 0.25
    medium: 0.35
    high: 0.25

applications:
  applications_per_customer_max: 2
  channel_weights:
    app: 0.40
    web: 0.30
    branch: 0.15
    partner: 0.15
  requested_amount_min: 300
  requested_amount_max: 8000
  requested_term_months_choices: [3, 6, 12, 18, 24]
  cancellation_rate: 0.05

policy:
  approval_score_cutoff: 0.5
  offered_rate: 0.035
  approved_term_months_max: 24

booking:
  booking_rate_given_approved: 0.85
  max_days_approval_to_contract: 10

contract:
  max_days_contract_to_disbursement: 2

payment_behavior:
  on_time_probability: 0.70
  partial_payment_probability: 0.12
  prepayment_probability: 0.05
  cure_probability_per_month: 0.20
  reversal_rate: 0.01
  allocation_order: [fees, interest, principal]

collections:
  contact_dpd_thresholds: [15, 45, 75]
  promise_to_pay_probability: 0.35

write_off:
  dpd_threshold: 150

recovery:
  recovery_probability: 0.25
  recovery_fraction_min: 0.05
  recovery_fraction_max: 0.40
  max_months_after_write_off: 6

tolerance:
  monetary_tolerance: 0.01

output:
  format: parquet
  operational_dir: data/synthetic
  truth_dir: data/synthetic_truth

macro_shock:
  # Roughly mid-period, leaving 6 pre-shock and 6 post-shock months for
  # the smoke/sample scale's 2024 calendar-year period - enough of each
  # side to test pre-shock identity and post-shock direction separately.
  shock_date: 2024-07-01
  # Applied by _effective_payment_behavior as a straight multiplicative
  # adjustment to baseline's own payment_behavior probabilities, each
  # clipped back into [0, 1] - a documented, synthetic mechanism, not a
  # claimed macro-econometric model:
  #   on_time_probability      *= 0.65   (worse on-time performance)
  #   partial_payment_probability *= 1.30 (more partial payments, fewer full ones)
  #   prepayment_probability   *= 0.40   (households prepay less under stress)
  #   cure_probability_per_month *= 0.50 (delinquent contracts cure less often)
  on_time_probability_multiplier: 0.65
  partial_payment_probability_multiplier: 1.30
  prepayment_probability_multiplier: 0.40
  cure_probability_multiplier: 0.50
  synthetic_source_id: synthetic-stress-shock-v1
  # An illustrative synthetic stress-index level (unitless, not a real BCB
  # series value) recorded on the new macro_context_monthly rows this
  # shock adds - see credlens.generation.macro.generate_macro_context.
  synthetic_shock_value: 1.0
  synthetic_shock_description: >
    Illustrative synthetic stress index (arbitrary unit, not a real
    BCB series or macroeconomic indicator) recorded on
    macro_context_monthly rows with source_type=synthetic_shock for
    every month from shock_date through the end of the simulated
    period. Marks the same window used
    to shock payment_behavior probabilities - not itself read back by
    the payment simulation (the shock_date field is what the ledger
    simulation actually branches on).
