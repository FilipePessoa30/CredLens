scenario_id: baseline
name: "Baseline"
description: >
  Reference scenario: one policy version in force for the whole simulated
  period, no macro stress, no collections-strategy change, no injected
  data-quality defects. Every other scenario is defined as a variation
  from this one - see docs/synthetic_generation_spec.md.
status: requires_calibration

population:
  customer_arrival_pattern:
    status: requires_calibration
    description: "Rate/distribution of new synthetic customers entering the simulation over time."
  applications_per_customer:
    status: requires_calibration
    description: "Distribution of how many applications a given synthetic customer submits."
  segment_mix:
    status: requires_calibration
    description: "Relative sizes of the latent generator segments (see docs/conceptual_data_model.md section 4.17)."

origination:
  policy_profile:
    status: specified
    value: single_policy_version
    description: "Exactly one policy_versions row is active for the entire period - no policy change events."
  approval_rate_target:
    status: requires_calibration
    description: "No real approval-rate benchmark exists for this fictional scenario - left unset rather than guessed."

performance:
  payment_behavior_model:
    status: pending
    description: "Not yet designed - see docs/synthetic_generation_spec.md open questions on payment timing/amount distributions."
  default_rate_target:
    status: requires_calibration
    description: "No real default-rate benchmark exists for this fictional scenario - left unset rather than guessed."
  cure_rate_target:
    status: requires_calibration
    description: "No real cure-rate benchmark exists for this fictional scenario - left unset rather than guessed."

temporal_dependence:
  seasonality:
    status: pending
    description: "Whether/how origination volume varies by calendar month - not yet designed."
  policy_change_events:
    status: specified
    value: none
    description: "Baseline has zero policy change events, by definition - contrast with policy_expansion/policy_tightening."
  macro_stress_events:
    status: specified
    value: none
    description: "Baseline has zero macro stress events - contrast with macroeconomic_stress."

reproducibility:
  seed_strategy:
    status: specified
    value: explicit_per_run
    description: "Each generation_runs row records its own seed (see contracts/operational/generation_runs.yaml) - determinism is per-run, not global."
