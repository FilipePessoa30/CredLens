scenario_id: baseline
name: "Baseline"
description: >
  Reference scenario: one policy version in force for the whole simulated
  period, no macro stress, no collections-strategy change, no injected
  data-quality defects. Every other scenario is defined as a variation
  from this one - see docs/synthetic_generation_spec.md.

  Phase 4A update: this scenario now has a concrete, executable
  configuration - config/synthetic/baseline.generation.yaml, loaded by
  src/credlens/generation/config.py and consumed by
  src/credlens/generation/orchestrator.py. Every parameter value below
  mirrors that file and is an explicit SYNTHETIC ASSUMPTION, chosen to
  produce an internally coherent, contract-valid toy portfolio - none of
  it is calibrated from, or claimed to represent, any real lender or
  market. See docs/synthetic_generation_implementation.md.
status: synthetic_assumptions_specified

population:
  customer_arrival_pattern:
    status: specified
    value: uniform_over_period
    unit: "n/a (distribution family)"
    description: "Synthetic customers arrive uniformly at random across the simulated period - no seasonality modeled in baseline."
    justification: "Simplest arrival process that still produces a longitudinal spread of origination dates; seasonality is explicitly out of scope for baseline (see temporal_dependence.seasonality below)."
  applications_per_customer:
    status: specified
    value: "uniform integer in [1, 2]"
    unit: "count"
    description: "Each synthetic customer submits 1 or 2 applications, uniformly at random."
    justification: "A small, bounded range keeps the application volume proportional to the customer count without an unbounded tail; matches config/synthetic/baseline.generation.yaml's applications.applications_per_customer_max=2."
  segment_mix:
    status: specified
    value: "bureau_score_bucket_weights: thin_file=0.15, low=0.25, medium=0.35, high=0.25"
    unit: "probability weights, sum to 1.0"
    description: "Relative sizes of the four bureau-score-bucket segments used both for the (visible) decision score and to shape (via a separate latent draw, never the same number) simulated payment behavior."
    justification: "An arbitrary but plausible-shaped mix skewed toward the middle of the distribution, not toward either extreme - a deliberate synthetic choice, not derived from any real bureau's published distribution."

origination:
  policy_profile:
    status: specified
    value: single_policy_version
    unit: "n/a"
    description: "Exactly one policy_versions row is active for the entire period - no policy change events."
    justification: "Baseline's own definition (docs/synthetic_generation_spec.md): every other scenario is a variation FROM this single-policy baseline."
  approval_rate_target:
    status: specified
    value: "not a direct target - emerges from approval_score_cutoff=0.5 applied to the synthetic decision score"
    unit: "n/a"
    description: "No approval-rate target is set directly; approval is a consequence of the score cutoff, not a calibrated business rate."
    justification: "Setting a target approval rate directly would imply a real business calibration this project explicitly does not have (see docs/assumptions_and_limitations.md) - the cutoff is the only tunable knob, and the resulting rate is reported, never asserted in advance."

performance:
  payment_behavior_model:
    status: specified
    value: "categorical draw {on_time, partial, prepay, no_pay} per contract per month, weighted by a per-contract latent propensity"
    unit: "n/a"
    description: "See config/synthetic/baseline.generation.yaml's payment_behavior section and src/credlens/generation/payments.py for the exact formula."
    justification: "A per-contract latent propensity (truth.py, isolated per docs/adr/0007) creates realistic heterogeneity (some contracts consistently perform well, others don't) instead of every month being an independent identical coin flip - closer to how real repayment behavior clusters by borrower, without claiming to model any specific real population."
  default_rate_target:
    status: pending
    description: "No default-rate target is set - 'default' itself remains an unconfigured, versioned definition (see docs/metric_semantics.md) that this phase deliberately does not resolve. Whatever write-off rate baseline produces is a byproduct of write_off.dpd_threshold=150, not a calibrated target."
  cure_rate_target:
    status: specified
    value: 0.20
    unit: "probability per month, scaled by latent propensity"
    description: "cure_probability_per_month: chance a delinquent contract fully catches up in a given month, before write-off."
    justification: "A moderate, round synthetic value - not derived from any real portfolio's observed cure behavior."

temporal_dependence:
  seasonality:
    status: specified
    value: none
    unit: "n/a"
    description: "Origination volume does not vary by calendar month in baseline - customer arrival is uniform (see population.customer_arrival_pattern)."
    justification: "Explicitly out of scope for baseline; a seasonal arrival pattern is a natural extension for a future scenario, not modeled here to keep this phase's first working generator simple to verify."
  policy_change_events:
    status: specified
    value: none
    unit: "n/a"
    description: "Baseline has zero policy change events, by definition - contrast with policy_expansion/policy_tightening."
  macro_stress_events:
    status: specified
    value: none
    unit: "n/a"
    description: "Baseline has zero macro stress events - contrast with macroeconomic_stress. macro_context_monthly in a baseline run contains only real, unmodified BCB observations (source_type=public_bcb_observation), never a synthetic shock row - see docs/adr/0008-macro-context-provenance.md."

reproducibility:
  seed_strategy:
    status: specified
    value: explicit_per_run
    unit: "n/a"
    description: "Each generation_runs row records its own seed (see contracts/operational/generation_runs.yaml) - determinism is per-run, not global."
    justification: "Lets two runs with different seeds coexist and be independently reproduced, rather than requiring a single global seed for the whole repository."
  default_seed:
    status: specified
    value: 2026
    unit: "integer"
    description: "config/synthetic/baseline.generation.yaml's default_seed - used when the CLI's --seed is not otherwise overridden by the caller (the CLI always requires --seed explicitly, so this is a documented default for programmatic callers of generate_baseline(), not a hidden fallback used silently)."
    justification: "An arbitrary, memorable integer - carries no calibration meaning."
