scenario_id: policy_tightening
name: "Policy Tightening"
description: >
  Mirror image of policy_expansion: a second, stricter policy_versions row
  replaces the first partway through the period - exercises whether
  audit/portfolio code correctly attributes an approval-rate drop and any
  quality improvement to the policy change.
status: requires_calibration

population:
  customer_arrival_pattern:
    status: requires_calibration
    description: "Same open question as baseline; may additionally need a volume-response-to-stricter-policy assumption."
  applications_per_customer:
    status: requires_calibration
    description: "Same open question as baseline."
  segment_mix:
    status: requires_calibration
    description: "Same open question as baseline."

origination:
  policy_profile:
    status: specified
    value: two_policy_versions_stricter_second
    description: "policy_versions gains a second row with a later effective_from and (conceptually) a stricter cutoff than the first."
  approval_rate_target:
    status: requires_calibration
    description: "Both the before- and after-tightening approval rate are unset."

performance:
  payment_behavior_model:
    status: pending
    description: "Same open question as baseline."
  default_rate_target:
    status: requires_calibration
    description: "Whether the stricter policy's cohort shows a different default rate is exactly what this scenario is meant to let a later phase test - no target is set here."
  cure_rate_target:
    status: requires_calibration
    description: "Same open question as baseline."

temporal_dependence:
  seasonality:
    status: pending
    description: "Same open question as baseline."
  policy_change_events:
    status: specified
    value: single_tightening_event
    description: "Exactly one policy-tightening event partway through the period."
  macro_stress_events:
    status: specified
    value: none
    description: "No macro stress in this scenario - isolates the policy-change effect."

reproducibility:
  seed_strategy:
    status: specified
    value: explicit_per_run
    description: "Same as baseline."
