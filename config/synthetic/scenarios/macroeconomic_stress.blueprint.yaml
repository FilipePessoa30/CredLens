scenario_id: macroeconomic_stress
name: "Macroeconomic Stress"
description: >
  Variation on baseline where portfolio-wide payment behavior worsens for
  a defined window, independent of any policy change - conceptually
  related to macro_context_monthly (see contracts/operational), though
  this scenario's stress dynamics are a generator behavior, not a direct
  read of the real BCB series acquired in Phase 2.
status: requires_calibration

population:
  customer_arrival_pattern:
    status: requires_calibration
    description: "Same open question as baseline; may additionally need a volume-response-to-stress assumption (e.g. fewer applications during stress)."
  applications_per_customer:
    status: requires_calibration
    description: "Same open question as baseline."
  segment_mix:
    status: requires_calibration
    description: "Same open question as baseline."

origination:
  policy_profile:
    status: specified
    value: single_policy_version
    description: "No policy change in this scenario - isolates the macro-stress effect, same as baseline's single policy."
  approval_rate_target:
    status: requires_calibration
    description: "Same open question as baseline."

performance:
  payment_behavior_model:
    status: pending
    description: "Needs a stress-window modifier on top of whatever baseline payment model is eventually designed - not yet designed either way."
  default_rate_target:
    status: requires_calibration
    description: "The stress window's elevated default rate, relative to baseline, is exactly what this scenario is meant to let a later phase test - no target is set here."
  cure_rate_target:
    status: requires_calibration
    description: "Same open question as baseline, likely also suppressed during the stress window."

temporal_dependence:
  seasonality:
    status: pending
    description: "Same open question as baseline."
  policy_change_events:
    status: specified
    value: none
    description: "No policy changes in this scenario - isolates the macro-stress effect."
  macro_stress_events:
    status: specified
    value: single_stress_window
    description: "Exactly one defined stress window (start/end dates pending) during which performance parameters worsen."

reproducibility:
  seed_strategy:
    status: specified
    value: explicit_per_run
    description: "Same as baseline."
