scenario_id: data_quality_incident
name: "Data Quality Incident"
description: >
  Variation on baseline that deliberately injects a defined data-quality
  defect (e.g. a batch of snapshots with a stale next_due_date, or a
  short gap in account_monthly_snapshots for one contract cohort) -
  exercises whether credlens.contracts' own audit-mode validation
  actually detects the injected defect. This scenario is a test of the
  validation tooling itself, not of portfolio behavior.
status: requires_calibration

population:
  customer_arrival_pattern:
    status: requires_calibration
    description: "Same open question as baseline."
  applications_per_customer:
    status: requires_calibration
    description: "Same open question as baseline."
  segment_mix:
    status: requires_calibration
    description: "Same open question as baseline."

origination:
  policy_profile:
    status: specified
    value: single_policy_version
    description: "No origination policy change in this scenario - the incident is confined to downstream data, not origination logic."
  approval_rate_target:
    status: requires_calibration
    description: "Same open question as baseline."

performance:
  payment_behavior_model:
    status: pending
    description: "Same open question as baseline."
  default_rate_target:
    status: requires_calibration
    description: "Same open question as baseline - not the focus of this scenario."
  cure_rate_target:
    status: requires_calibration
    description: "Same open question as baseline - not the focus of this scenario."

temporal_dependence:
  seasonality:
    status: pending
    description: "Same open question as baseline."
  policy_change_events:
    status: specified
    value: none
    description: "No policy changes in this scenario."
  macro_stress_events:
    status: specified
    value: none
    description: "No macro stress in this scenario."
  injected_defect_type:
    status: pending
    description: "Which specific defect to inject (missing snapshot month, stale next_due_date, duplicate row, out-of-domain code, etc.) is not yet chosen - see docs/synthetic_generation_spec.md open questions."
  injected_defect_window:
    status: pending
    description: "When/how much of the data the injected defect affects - not yet chosen."

reproducibility:
  seed_strategy:
    status: specified
    value: explicit_per_run
    description: "Same as baseline - the defect injection itself must also be deterministic given the seed, once designed."
