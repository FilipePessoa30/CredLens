scenario_id: collections_change
name: "Collections Strategy Change"
description: >
  Variation on baseline where the collections strategy applied to
  delinquent contracts changes partway through the period - exercises
  whether a future recovery/cure analysis correctly attributes a change
  in recovery outcomes to the strategy change rather than treating it as
  unexplained. Directly related to collection_events.strategy (see
  contracts/operational/collection_events.yaml).
status: requires_calibration

population:
  customer_arrival_pattern:
    status: requires_calibration
    description: "Same open question as baseline."
  applications_per_customer:
    status: requires_calibration
    description: "Same open question as baseline."
  segment_mix:
    status: requires_calibration
    description: "Same open question as baseline."

origination:
  policy_profile:
    status: specified
    value: single_policy_version
    description: "No origination policy change in this scenario - isolates the collections-strategy effect."
  approval_rate_target:
    status: requires_calibration
    description: "Same open question as baseline."

performance:
  payment_behavior_model:
    status: pending
    description: "Same open question as baseline for pre-delinquency behavior."
  default_rate_target:
    status: requires_calibration
    description: "Same open question as baseline - this scenario targets recovery, not origination-side default rate."
  cure_rate_target:
    status: requires_calibration
    description: "The before/after cure and recovery rates under the two collections strategies are exactly what this scenario is meant to let a later phase test - no targets are set here."

temporal_dependence:
  seasonality:
    status: pending
    description: "Same open question as baseline."
  policy_change_events:
    status: specified
    value: none
    description: "No origination policy changes in this scenario."
  macro_stress_events:
    status: specified
    value: none
    description: "No macro stress in this scenario - isolates the collections-strategy effect."
  collections_strategy_change_event:
    status: specified
    value: single_strategy_switch
    description: "Exactly one collections-strategy switch (e.g. early-stage-soft to early-stage-firm) partway through the period, timing pending."

reproducibility:
  seed_strategy:
    status: specified
    value: explicit_per_run
    description: "Same as baseline."
