# CredLens - Phase 9 monitoring-simulation batch definitions.
#
# "Monitoring simulation on a historical public benchmark" (Phase 9
# section 14) - the UCI dataset has no real operational timeline, so these
# batches are NOT dated production data. They are built by partitioning
# the OFFICIALLY LOCKED test set (already evaluated once, Phase 8) into 12
# equal, non-overlapping, ID-ordered slices (`source_partition` 1..12 -
# an arbitrary acquisition-order slice, never a real calendar date), each
# then perturbed according to its own `simulation_scenario`. Because the
# 12 slices are non-overlapping and exhaust the test set (12 x 500 = 6000
# rows), no row is reused across batches. Reusing the test set here is
# safe: the model is already frozen/registered (Phase 8) and nothing in
# this batch-scoring pass retunes, recalibrates, or reselects a threshold
# - it is read-only scoring for a monitoring demonstration, kept entirely
# separate from the one official test-set evaluation already frozen in
# the Phase 9 evidence manifest.

scenarios_config_version: "1.0.0"

batch_size: 500
seed: 20260728

batches:
  - batch_sequence: 1
    simulation_scenario: "baseline_like"
    source_partition: 1
    label_availability: "available"
    description: "Unperturbed slice - used to measure the false-alert rate under natural sampling variability."

  - batch_sequence: 2
    simulation_scenario: "missingness_drift"
    source_partition: 2
    label_availability: "available"
    missingness_extra_fraction: 0.15

  - batch_sequence: 3
    simulation_scenario: "utilization_shift"
    source_partition: 3
    label_availability: "available"
    utilization_shift_multiplier: 1.5

  - batch_sequence: 4
    simulation_scenario: "payment_reduction"
    source_partition: 4
    label_availability: "available"
    payment_shrink_factor: 0.5

  - batch_sequence: 5
    simulation_scenario: "delinquency_worsening"
    source_partition: 5
    label_availability: "available"
    delinquency_worsening_steps: 1

  - batch_sequence: 6
    simulation_scenario: "out_of_domain_codes"
    source_partition: 6
    label_availability: "available"
    out_of_domain_delinquency_code: 15
    affected_fraction: 0.10

  - batch_sequence: 7
    simulation_scenario: "feature_range_violation"
    source_partition: 7
    label_availability: "available"
    impossible_bill_multiplier: 500.0
    affected_fraction: 0.02

  - batch_sequence: 8
    simulation_scenario: "prevalence_drift"
    source_partition: 8
    label_availability: "available"
    target_prevalence: 0.35

  - batch_sequence: 9
    simulation_scenario: "score_distribution_shift"
    source_partition: 9
    label_availability: "available"
    utilization_shift_multiplier: 1.3
    delinquency_worsening_steps: 1

  - batch_sequence: 10
    simulation_scenario: "subgroup_composition_shift"
    source_partition: 10
    label_availability: "available"
    oversampled_age_bucket: [18, 30]
    oversample_fraction: 0.80

  - batch_sequence: 11
    simulation_scenario: "label_delay"
    source_partition: 11
    label_availability: "pending"

  - batch_sequence: 12
    simulation_scenario: "corrupted_schema"
    source_partition: 12
    label_availability: "available"
    drop_column: "X6"
    affected_fraction: 1.0
