# CredLens - Phase 9 alert-threshold CALIBRATION RECIPE.
#
# These are NOT fixed institutional limits (Phase 9 section 16: "Não
# copie limites genéricos de mercado como verdade universal"). Each
# metric's actual numeric cutoff is derived at `monitor create-reference`
# time from the reference's own bootstrap resampling (see
# credlens.monitoring.thresholds.calibrate_thresholds) and written to
# reports/monitoring/reference/<reference_id>__alert_thresholds.json -
# this file only says WHICH percentile of that empirical null
# distribution to use for each state boundary, and the minimum sample
# size below which a metric is never alerted on at all.

thresholds_config_version: "1.0.0"

states:
  - "within_reference_variability"
  - "review"
  - "material_deviation"
  - "blocked_input"

# review_percentile: the bootstrap percentile of |batch - reference|
# beyond which a metric moves from within_reference_variability to
# review. material_deviation_percentile: the percentile beyond which it
# escalates further. Both computed from `n_resamples` reference-vs-
# reference resamples (config/monitoring/reference.yml's bootstrap), so
# the bands reflect this benchmark's OWN natural sampling noise rather
# than a market convention.
calibration:
  review_percentile: 95
  material_deviation_percentile: 99.5
  min_sample_size_for_alert: 30

metric_families:
  data_quality:
    metrics: ["missingness_rate", "domain_violation_rate", "range_violation_rate",
              "duplicate_rate"]
  feature_drift:
    metrics: ["psi", "ks_statistic", "wasserstein_distance", "jensen_shannon_divergence",
              "mean_shift", "median_shift", "variance_shift", "missingness_delta"]
  score_drift:
    metrics: ["score_psi", "score_mean_shift", "score_quantile_shift"]
  performance_drift:
    metrics: ["roc_auc_delta", "pr_auc_delta", "brier_delta", "ks_delta"]
  target_distribution_drift:
    metrics: ["event_rate_delta"]
  subgroup_composition_drift:
    metrics: ["max_composition_shift"]

# Phase 10B (Release Candidate Acceptance Remediation) - `data_quality`
# was DECLARED as a metric family above since Phase 9, but never actually
# wired to an Alert: `credlens.monitoring.data_quality.compute_data_
# quality` profiled every batch correctly (on the RAW, pre-imputation
# batch, already in the right pipeline position), but nothing ever built
# an Alert record from it, so missingness_drift/out_of_domain_codes/
# feature_range_violation could never be detected by
# credlens.monitoring.detection_eval even though the underlying metric
# was computed correctly the whole time.
#
# Its 4 metrics cannot be bootstrap-calibrated the way psi/score/
# performance metrics are: the reference population is the real,
# already-audited UCI benchmark, which by construction has ZERO
# missingness/domain/range/duplicate violations (Phase 8's own robustness
# report: "the real UCI file has zero missing values"). Every bootstrap
# resample of a zero-variance null is also exactly zero, so a percentile
# of that null is meaningless (review_cutoff == material_deviation_cutoff
# == 0.0, which would make classify_state's `>=` comparison flag even a
# genuinely clean batch as `material_deviation`). Fixed, explicitly
# documented cutoffs are used instead - deliberately NOT claimed to be
# bootstrap-derived - chosen well below every real perturbation
# scenario's injected magnitude (15% missingness, 10% domain violations,
# 2% range violations) and well above single-row data-entry noise.
data_quality_fixed_thresholds:
  review_rate_threshold: 0.01
  material_rate_threshold: 0.03

# Phase 10B - bootstrap-calibrated the same way as psi/score/performance
# (genuine non-degenerate null: real sampling variance in event rate and
# subgroup composition, unlike data_quality above).
target_distribution_drift_calibration:
  review_percentile: 95
  material_deviation_percentile: 99.5
  n_resamples: 500

# Family-wise (max absolute composition shift across every attribute x
# group pair per resample) - same rationale as psi_family_wise in
# `multiple_comparisons` below: sex/education/marriage together have
# ~9 groups, so checking each independently at its own 95th percentile
# would understate the true joint false-alert rate.
subgroup_composition_drift_calibration:
  review_percentile: 95
  material_deviation_percentile: 99.5
  n_resamples: 500

# blocked_input is never derived from a percentile - it fires ONLY when
# credlens.modeling.input_contract's strict mode rejects a batch-level
# schema violation (missing/extra/wrong-typed column), independent of any
# statistical threshold.

# Phase 10 gate F - multiple-comparisons calibration. An empirical audit
# (credlens.monitoring.calibration_study, 100 genuinely unperturbed
# 500-row batches drawn from the locked test set) found the ORIGINAL
# per-feature PSI calibration above produces a 60% family-wise false-
# alert rate (>=1 of the 18 simultaneous per-feature PSI checks firing),
# because each feature's 95th-percentile cutoff controls only ITS OWN
# marginal false-alert rate, not the probability that ANY of 18
# simultaneous checks fires. This section adds a SEPARATE, additional
# family-wise threshold (metric "psi_family_wise" in
# reports/monitoring/reference/<reference_id>__alert_thresholds.json),
# calibrated on the MAX PSI across all 18 features per resample rather
# than one feature's own marginal null - re-measured on the same 100
# baseline batches, this brought the family-wise rate to 4% (review) /
# 1% (material), matching the target. The original per-feature
# thresholds above are UNCHANGED and still drive individual "signal"
# records (Phase 10 gate G) - the family-wise threshold instead decides
# whether a batch's signals for a category escalate to "alert"-level
# review, and gate H's severity policy additionally requires persistence
# across consecutive batches before "high".
multiple_comparisons:
  strategy_description_en: >
    Family-wise max-statistic calibration decides alert-level escalation
    per category; Benjamini-Hochberg (FDR) ranks individual per-feature
    signals for exploratory drill-down without driving escalation on its
    own; consecutive-batch confirmation is required before any signal
    may reach "high" severity (gate H) or become an incident (gate G).
    Never a naive uncorrected per-metric p-value used as if it controlled
    the batch-level false-alert rate.
  family_wise_review_percentile: 95
  family_wise_material_deviation_percentile: 99.5
  family_wise_n_resamples: 500
  benjamini_hochberg_fdr: 0.10
  consecutive_batches_for_high_severity: 2
  consecutive_batches_for_incident: 2

# Phase 10 gate F calibration study parameters
# (credlens.monitoring.calibration_study.run_false_alert_rate_study /
# run_batch_size_study) - batches are unperturbed i.i.d. samples from the
# LOCKED TEST SET (the same population real monitored batches are drawn
# from - never the train+validation reference itself, which would be
# circular since the per-metric thresholds are already calibrated by
# resampling the reference).
calibration_study:
  n_baseline_batches: 100
  batch_size: 500
  seed: 20260728
  batch_sizes_studied: [250, 500, 1000, 2000]

# Demonstrative targets (Phase 10 gate F) - illustrative for this
# benchmark and calibration recipe, never a market/regulatory standard.
demonstrative_targets:
  max_false_alert_rate_per_metric: 0.05
  max_material_alert_rate_per_batch: 0.10
  max_high_severity_rate_in_normal_batch: 0.02
