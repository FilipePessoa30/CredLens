# CredLens - Phase 10B (Release Candidate Acceptance Remediation) scenario
# registry.
#
# This is the SINGLE source of truth for what each of the 12 documented
# monitoring scenarios (`config/monitoring/scenarios.yml`) is expected to
# produce - `credlens.monitoring.detection_eval.EXPECTED_OUTCOMES` is
# built FROM this file (never hand-duplicated), so the code and this
# documentation can never drift apart.
#
# Fields:
#   perturbation_layer     - "raw" (every real perturbation is applied to
#                             the pre-feature-engineering batch, before
#                             imputation/cleaning) or "none".
#   perturbation            - one-line description of what changes.
#   magnitude                - the concrete parameter(s) from scenarios.yml.
#   expected_observable      - the specific calibrated metric this
#                             scenario should move.
#   expected_category         - the Alert/AlertGroup category that metric
#                             belongs to.
#   expected_action           - what the pipeline should do: "score_with_
#                             signal" (score normally, but raise an
#                             alert), "blocked_input" (refuse to score),
#                             or "no_action" (nothing should fire).
#   blocking                 - true only for a batch-level schema
#                             violation (`corrupted_schema`).
#   labels_available          - whether `Y` is joined for this batch
#                             (matches scenarios.yml's own
#                             `label_availability`).
#   minimum_batch_size        - the smallest batch size this scenario's
#                             signal remains reliably distinguishable at,
#                             per the real batch-size study
#                             (`credlens.monitoring.calibration_study.
#                             run_batch_size_study` - see the Phase 10B
#                             report for the measured 250/500/1000/2000
#                             comparison: 250-row batches showed a
#                             materially wider natural-variability band
#                             on every metric checked).

scenarios_registry_version: "1.0.0"

scenarios:
  baseline_like:
    perturbation_layer: "none"
    perturbation: "Unperturbed slice."
    magnitude: null
    expected_observable: null
    expected_category: "none"
    expected_action: "no_action"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  missingness_drift:
    perturbation_layer: "raw"
    perturbation: "Extra missingness injected into the most-recent delinquency column."
    magnitude: "missingness_extra_fraction: 0.15"
    expected_observable: "missingness_rate"
    expected_category: "data_quality"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  utilization_shift:
    perturbation_layer: "raw"
    perturbation: "Bill amounts scaled up."
    magnitude: "utilization_shift_multiplier: 1.5"
    expected_observable: "psi (family-wise)"
    expected_category: "feature_drift"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  payment_reduction:
    perturbation_layer: "raw"
    perturbation: "Payment amounts halved."
    magnitude: "payment_shrink_factor: 0.5"
    expected_observable: "psi (family-wise)"
    expected_category: "feature_drift"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  delinquency_worsening:
    perturbation_layer: "raw"
    perturbation: "Delinquency status shifted worse by 1 step."
    magnitude: "delinquency_worsening_steps: 1"
    expected_observable: "psi (family-wise)"
    expected_category: "feature_drift"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  out_of_domain_codes:
    perturbation_layer: "raw"
    perturbation: "Delinquency-status values replaced with an undocumented code, quarantined row-by-row under the strict input contract (never a batch-level block)."
    magnitude: "out_of_domain_delinquency_code: 15, affected_fraction: 0.10"
    expected_observable: "domain_violation_rate"
    expected_category: "data_quality"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  feature_range_violation:
    perturbation_layer: "raw"
    perturbation: "Bill amounts scaled to an implausible magnitude, floored above the input contract's monetary sanity bound so the violation is deterministic regardless of which rows the affected-fraction mask selects (Phase 10B fix - see credlens.monitoring.batches)."
    magnitude: "impossible_bill_multiplier: 500.0, affected_fraction: 0.02"
    expected_observable: "range_violation_rate"
    expected_category: "data_quality"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  prevalence_drift:
    perturbation_layer: "raw"
    perturbation: "Target prevalence resampled - checked DIRECTLY on the label distribution (event_rate_delta), never only inferred through the score's own distribution."
    magnitude: "target_prevalence: 0.35"
    expected_observable: "event_rate_delta"
    expected_category: "target_distribution_drift"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  score_distribution_shift:
    perturbation_layer: "raw"
    perturbation: "Combined bill-scale and delinquency-step shift."
    magnitude: "utilization_shift_multiplier: 1.3, delinquency_worsening_steps: 1"
    expected_observable: "psi (family-wise)"
    expected_category: "feature_drift"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  subgroup_composition_shift:
    perturbation_layer: "raw"
    perturbation: "Age-bucket composition oversampled - checked DIRECTLY on sex/education/marriage/age-bucket composition (max_composition_shift), never only inferred through the score."
    magnitude: "oversampled_age_bucket: [18, 30], oversample_fraction: 0.80"
    expected_observable: "max_composition_shift"
    expected_category: "subgroup_composition_drift"
    expected_action: "score_with_signal"
    blocking: false
    labels_available: true
    minimum_batch_size: 500

  label_delay:
    perturbation_layer: "none"
    perturbation: "Labels withheld - performance/target-distribution drift cannot be computed."
    magnitude: null
    expected_observable: null
    expected_category: "none"
    expected_action: "labels_pending"
    blocking: false
    labels_available: false
    minimum_batch_size: 500

  corrupted_schema:
    perturbation_layer: "raw"
    perturbation: "A required column dropped entirely - a batch-level schema violation."
    magnitude: "drop_column: X6, affected_fraction: 1.0"
    expected_observable: "schema_validity"
    expected_category: "blocked_input"
    expected_action: "blocked_input"
    blocking: true
    labels_available: true
    minimum_batch_size: 500
