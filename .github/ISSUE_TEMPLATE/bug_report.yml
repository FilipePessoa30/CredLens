name: Bug report
description: Report something in CredLens that doesn't work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if this involves a security-sensitive issue (e.g., credential exposure), see `SECURITY.md` instead of filing a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands run, in order.
      placeholder: |
        1. uv sync --all-groups
        2. uv run credlens doctor
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version (`python --version`), and `uv --version` if used.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      render: shell
    validations:
      required: false
