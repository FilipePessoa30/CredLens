name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

# Phase 10 gate: CI reorganization. The original CI was a single ~25-minute
# monolithic job (measured this phase: 1489 tests, 25m12s, 95% coverage,
# ALL of lint/type-check/pytest/warehouse/analysis/notebook/dashboard/
# modeling/model_validation/monitoring run strictly in sequence, doubled
# across a 2-version Python matrix). Splitting it into parallel jobs by
# domain - the same domain boundaries the test file naming already follows
# (test_warehouse_*, test_analysis_*/test_dashboard_*, test_modeling_*/
# test_model_validation_*, test_monitoring_*) - lets independent domains
# run concurrently instead of strictly back-to-back. The genuine pipeline
# dependency (a registered model must exist before monitoring can build a
# reference against it) is expressed with `needs:` + artifact upload/
# download, never duplicated or worked around. No `|| true`, no critical
# step removed, no module excluded from coverage - see
# tests/test_ci_workflow_integrity.py, which parses this file and fails
# the `quality` job if a tolerance-masking pattern ever reappears.
#
# The 2-version (3.11/3.12) compatibility matrix is kept on the fast
# `quality` + `unit-tests` jobs (cheap to double); the heavier domain-
# integration jobs run once, on 3.11 only - the fast matrix already proves
# cross-version compatibility for the bulk of the codebase, so doubling
# every heavy integration job too would cost CI minutes without adding
# real coverage.
jobs:
  quality:
    name: Lint, format, type-check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-groups --extra warehouse --extra analysis --extra dashboard \
            --extra notebook --extra modeling --python ${{ matrix.python-version }}

      # Fase 11C Gate A 4.2 - makes the actual interpreter driving every
      # step below directly visible in the raw log, not just inferred
      # from the matrix label - the exact ambiguity the --python pins
      # below exist to eliminate.
      - name: Confirm the real Python version this job will use
        run: uv run --python "${{ matrix.python-version }}" python --version

      # Every `uv run` below pins --python explicitly: this repo commits
      # a `.python-version` file (pinned to "3.11", for local/editor
      # convenience) - `uv run` with NO --python flag consults that file
      # regardless of what `--python` the PRECEDING `uv sync` used, so on
      # the 3.12 matrix leg a bare `uv run` would silently drop back to
      # the 3.11 environment/interpreter, orphaning the 3.12 install this
      # job just did. Confirmed by direct reproduction (both native Linux
      # and Windows): `uv sync --python 3.12 ... && uv run mypy ...`
      # (no --python on the second command) fails with "Cannot find
      # implementation or library stub" for every extras-only dependency
      # (dbt, duckdb, matplotlib, PIL) - the 3.11 leg "accidentally"
      # passed only because 3.11 happens to match `.python-version`.
      - name: Lint (ruff check)
        run: uv run --python "${{ matrix.python-version }}" ruff check .

      - name: Format check (ruff format)
        run: uv run --python "${{ matrix.python-version }}" ruff format --check .

      - name: Type check (mypy)
        run: uv run --python "${{ matrix.python-version }}" mypy src tests dashboard

      # Phase 10 gate B/CI-integrity: a workflow-inspecting test that
      # parses THIS file and fails if a `|| true`/`continue-on-error:
      # true`/similar tolerance-masking pattern is ever reintroduced on a
      # critical step - runs here (fast, no heavy fixtures) rather than
      # in `unit-tests` so a masked gate fails the workflow immediately.
      - name: CI workflow integrity check (no tolerance-masking patterns)
        run: uv run --python "${{ matrix.python-version }}" pytest tests/test_ci_workflow_integrity.py -q

  unit-tests:
    name: Unit/fast tests + coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-groups --extra warehouse --extra analysis --extra dashboard \
            --extra notebook --extra modeling --python ${{ matrix.python-version }}

      # Fase 11C Gate A 4.2 - see the `quality` job's identical step.
      - name: Confirm the real Python version this job will use
        run: uv run --python "${{ matrix.python-version }}" python --version

      # `data/raw/` is gitignored and never committed - tests/
      # test_analysis_benchmark.py's TestProfilePublicSources reads the
      # real acquired UCI benchmark directly from disk (not slow-marked,
      # so it runs in THIS job), and degrades to an empty profile list
      # (not an error) when the file is absent - which then fails its
      # own "expected at least one already-acquired public source"
      # assertion. Confirmed as (part of) the real cause of this job's
      # long-but-failing runs: fetch it first, exactly as a human
      # contributor's own local setup would.
      - name: Fetch the UCI benchmark dataset
        run: uv run --python "${{ matrix.python-version }}" credlens data fetch --source uci-default-credit

      # Every generation-related test in this suite runs at 'smoke' scale
      # (a few hundred customers, well under a second) or, for Monte Carlo
      # tests, 2 seeds at 'smoke' scale - 'sample'/'portfolio' scale and any
      # wide Monte Carlo sweep are never run in CI (Phase 4B section 19).
      # `-m "not slow"` excludes the real-30k-row-benchmark modeling/
      # model_validation/monitoring integration tests - those run once
      # each, unmatrixed, in the `modeling-validation`/`monitoring` jobs
      # below (not skipped, just relocated so this fast job stays fast).
      # --python pinned explicitly on every uv run below - see the
      # `quality` job's identical comment (a committed `.python-version`
      # file pinned to "3.11" makes a bare `uv run` silently ignore the
      # 3.12 environment `uv sync --python 3.12` just installed above).
      - name: Test with coverage (pytest, excluding slow-marked tests)
        run: |
          uv run --python "${{ matrix.python-version }}" pytest -m "not slow" \
            --cov=credlens --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      - name: CLI smoke check
        run: uv run --python "${{ matrix.python-version }}" credlens doctor

  warehouse-integration:
    name: Warehouse (synthetic generation + dbt build/test/reconcile)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --extra warehouse --python "3.11"

      # Slow-marked warehouse/generation integration tests (dbt-backed),
      # run once here rather than in the fast `unit-tests` matrix.
      - name: Warehouse/generation slow tests
        run: uv run pytest tests/test_warehouse_*.py tests/test_generation_*.py -m slow -q

      # `credlens warehouse build` itself invokes dbt-core's dbtRunner,
      # which parses the project before running it - a separate `dbt
      # parse` step would be redundant, so a failed parse surfaces here
      # as a failed build.
      - name: Generate a deterministic smoke run for warehouse validation
        run: |
          uv run credlens synthetic generate --scenario baseline --scale smoke --seed 2026 --force \
            | tee generate_output.txt
          RUN_ID=$(grep '^generation_run_id:' generate_output.txt | awk '{print $2}')
          echo "WAREHOUSE_CI_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Warehouse build (dbt parse + run + generic/singular tests)
        run: |
          uv run credlens warehouse build \
            --run-id "$WAREHOUSE_CI_RUN_ID" --build-id CI_WAREHOUSE_BUILD --force

      - name: Warehouse test (re-run dbt tests, no rebuild)
        run: uv run credlens warehouse test --build-id CI_WAREHOUSE_BUILD

      - name: Warehouse independent Python reconciliation
        run: uv run credlens warehouse reconcile --build-id CI_WAREHOUSE_BUILD

      - name: Warehouse CLI smoke checks (status/query/docs)
        run: |
          uv run credlens warehouse status --build-id CI_WAREHOUSE_BUILD
          uv run credlens warehouse query --build-id CI_WAREHOUSE_BUILD --name portfolio_monthly
          uv run credlens warehouse docs --build-id CI_WAREHOUSE_BUILD

      - name: Prove no official warehouse/ artifact was ever altered
        run: |
          git status --porcelain warehouse/ | tee ci_git_status_warehouse.txt
          test ! -s ci_git_status_warehouse.txt

  analytics-dashboard:
    name: Analysis, notebook, and dashboard (8 pages, demo + warehouse mode)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-groups --extra warehouse --extra analysis --extra dashboard \
            --extra notebook --python "3.11"

      # test_analysis_runner.py's benchmark-figure test needs at least
      # one real, already-acquired public source (profile_public_sources
      # degrades to an empty list, not an error, when none are found -
      # which then fails its own "benchmark figure was written"
      # assertion) - see the `unit-tests`/`modeling-validation` jobs'
      # identical fetch step and comment.
      - name: Fetch the UCI benchmark dataset
        run: uv run credlens data fetch --source uci-default-credit

      # Slow-marked analysis/dashboard integration tests, run once here.
      - name: Analysis/dashboard slow tests
        run: uv run pytest tests/test_analysis_*.py tests/test_dashboard_*.py -m slow -q

      # Portfolio analysis layer (Phase 6): the analysis CLI needs a SUITE
      # (baseline + every CRN scenario), not a single run, to compare
      # scenarios. Multi-seed robustness (--multiseed) is intentionally
      # NOT run here - out of scope for CI (Phase 6 section 22); proven
      # once by tests/test_analysis_runner.py instead. The benchmark
      # appendix is also skipped (--no-benchmark): the public datasets it
      # profiles live under gitignored data/raw/ and are never fetched in
      # CI - tests/test_analysis_benchmark.py proves graceful degradation.
      - name: Generate a deterministic smoke suite for analysis validation
        run: uv run credlens synthetic generate-suite --scale smoke --seed 900001 --force

      - name: Analysis warehouse build (dbt build against the smoke suite)
        run: |
          uv run credlens warehouse build \
            --suite-id SUITE_smoke_900001 --build-id CI_ANALYSIS_BUILD --force

      - name: Analysis validate (no full run)
        run: uv run credlens analysis validate --build-id CI_ANALYSIS_BUILD

      - name: Analysis run (smoke scale, no benchmark, CI-scoped output dir)
        run: |
          uv run credlens analysis run --build-id CI_ANALYSIS_BUILD \
            --output-dir /tmp/ci_portfolio_analysis --no-benchmark --insights

      - name: Validate analysis outputs were really written
        run: |
          test -s /tmp/ci_portfolio_analysis/manifest.json
          test -s /tmp/ci_portfolio_analysis/executive_summary.md
          test -s /tmp/ci_portfolio_analysis/executive_summary.pt-BR.md
          test -s /tmp/ci_portfolio_analysis/technical_report.md
          test -s /tmp/ci_portfolio_analysis/technical_report.pt-BR.md
          test -s /tmp/ci_portfolio_analysis/insights.yml
          FIGURE_COUNT=$(find /tmp/ci_portfolio_analysis/figures -name '*.png' | wc -l)
          echo "Generated $FIGURE_COUNT figures"
          test "$FIGURE_COUNT" -ge 8
          uv run python -c "
          import json
          m = json.load(open('/tmp/ci_portfolio_analysis/manifest.json'))
          assert m['final_status'] == 'success', m['final_status']
          assert not m['warnings'], m['warnings']
          "

      - name: Analysis CLI smoke checks (scenarios/status/benchmark)
        run: |
          uv run credlens analysis scenarios --build-id CI_ANALYSIS_BUILD
          uv run credlens analysis status --output-dir /tmp/ci_portfolio_analysis
          uv run credlens analysis benchmark

      - name: Analysis reproduce (idempotency proof)
        run: |
          uv run credlens analysis reproduce --output-dir /tmp/ci_portfolio_analysis \
            --reproduce-dir /tmp/ci_portfolio_analysis_reproduce --json

      # Notebook (Phase 7): executes the case-study notebook end to end in
      # a real Jupyter kernel against the committed, versioned
      # reports/portfolio_analysis/ - never data/warehouse/ or any CI-only
      # scratch build. Output goes to a scratch path outside the repo.
      - name: Notebook - execute end to end in a real kernel
        run: |
          uv run jupyter nbconvert --to notebook --execute \
            notebooks/credit_portfolio_case_study.ipynb \
            --output /tmp/ci_notebook_executed.ipynb \
            --ExecutePreprocessor.timeout=120

      # Decision Intelligence Dashboard (Phase 7): validates both a real
      # build and a demo package exported from it, then drives every one
      # of the 10 pages (8 Phase 7 pages + Model Lab + Model Monitoring
      # Lab) through streamlit.testing.v1.AppTest in both modes - the
      # strongest verification available without a browser in CI (see the
      # separate, locally-run visual QA pass with a real headless browser,
      # documented in the Phase 10 final report).
      - name: Dashboard - export demo package from the CI analysis build
        run: |
          uv run credlens dashboard export-demo --build-id CI_ANALYSIS_BUILD \
            --analysis-output-dir /tmp/ci_portfolio_analysis \
            --output-dir /tmp/ci_dashboard_demo

      - name: Dashboard - validate the build and the demo package
        run: |
          uv run credlens dashboard validate --build-id CI_ANALYSIS_BUILD
          uv run credlens dashboard validate --demo --demo-data-dir /tmp/ci_dashboard_demo

      - name: Dashboard - AppTest execution of the 8 Phase 7 pages (demo + warehouse mode)
        env:
          CREDLENS_TEST_DEMO_DATA_DIR: /tmp/ci_dashboard_demo
          CREDLENS_TEST_BUILD_ID: CI_ANALYSIS_BUILD
        run: uv run pytest tests/test_dashboard_apptest.py -q

      - name: Prove no official portfolio_analysis/ or analysis/ artifact was ever altered
        run: |
          git status --porcelain reports/portfolio_analysis/ analysis/ | tee ci_git_status_analysis.txt
          test ! -s ci_git_status_analysis.txt

  modeling-validation:
    name: Modeling + independent validation (CI-scoped candidate)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --extra analysis --extra modeling --extra dashboard --python "3.11"

      # `data/raw/` is gitignored (data/* - see .gitignore) and this raw,
      # real, third-party benchmark is never committed - a fresh checkout
      # has none of it. Every step below (the slow tests' own fixtures,
      # data-audit, the CI-scoped training pipeline) reads it directly
      # from disk, so it must be fetched here first - confirmed missing
      # by direct reproduction: this job's "Modeling/model_validation
      # slow tests" step failed in ~28s on every run, consistent with an
      # immediate FileNotFoundError, never a genuine mid-suite failure.
      - name: Fetch the UCI benchmark dataset
        run: |
          uv run credlens data fetch --source uci-default-credit
          uv run credlens data verify --source uci-default-credit

      # Fase 11D - this job is a fresh runner: `reports/modeling/
      # experiments/EXP_behavioral_default_v1/models/*.joblib` and
      # `reports/modeling/tables/EXP_behavioral_default_v1__predictions_
      # test.csv` are intentionally gitignored (bulky, regenerable
      # per-experiment working output, never a frozen reference constant
      # - see .gitignore's reports/modeling comment), yet several of the
      # slow tests below (tests/test_reason_code_policy.py's
      # TestEnforcementOnTheRealOfficialModel) read them directly from
      # disk. Found by direct clean-room reproduction: this job's own
      # slow-tests step failed with FileNotFoundError for both, on every
      # run, once the UCI-fetch/dashboard-orphan gaps above were fixed
      # and this job could finally run far enough to reach them.
      #
      # Retraining is NOT byte-reproducible for this experiment (unlike
      # `model validate-independent`, which has no timestamp field):
      # `EXP_behavioral_default_v1.json` and the bilingual reports/tables
      # embed `created_at_utc` and the installed `credlens` version, so
      # `git checkout --` immediately after restores every TRACKED file
      # this touches to its exact committed content - only the newly
      # created, gitignored working artifacts (the .joblib files,
      # predictions_test.csv, ...) are left in place. Mirrors this job's
      # own already-established "restore the official decision/report"
      # step for the same reason.
      - name: Model - regenerate the official EXP_behavioral_default_v1 working artifacts
        run: |
          uv run credlens model train --experiment-id EXP_behavioral_default_v1 --seed 42
          uv run credlens model evaluate --experiment-id EXP_behavioral_default_v1
          uv run credlens model compare --experiment-id EXP_behavioral_default_v1
          uv run credlens model explain --experiment-id EXP_behavioral_default_v1
          uv run credlens model audit-groups --experiment-id EXP_behavioral_default_v1
          uv run credlens model stress-test --experiment-id EXP_behavioral_default_v1
          uv run credlens model register-challenger --experiment-id EXP_behavioral_default_v1
          uv run credlens model compare-candidates --experiment-id EXP_behavioral_default_v1
          uv run credlens model audit-collinearity --model-id MODEL_behavioral_default_v1
          git checkout -- reports/modeling/ reports/model_validation/

      # Slow-marked modeling/model_validation integration tests (full
      # staged pipeline + independent recomputation on the real 30k-row
      # UCI benchmark), run once here rather than in the fast matrix.
      - name: Modeling/model_validation slow tests
        run: |
          uv run pytest tests/test_modeling_*.py tests/test_model_validation_*.py \
            tests/test_cli_model.py tests/test_reason_code_policy.py -m slow -q

      # Runs here - BEFORE the CI-scoped CI_MODEL_SMOKE pipeline below ever
      # registers a second "candidate" model - because tests/test_dashboard_
      # model_lab.py::test_defaults_to_the_registered_candidate_not_a_gate_d_
      # sibling is a real-repo regression check that asserts the page
      # defaults to EXP_behavioral_default_v1 specifically. `_default_
      # experiment_index` (src/credlens/dashboard/model_lab.py) has no
      # notion of "the official one" - it returns the experiment behind
      # the alphabetically-first `*.manifest.json` whose status is
      # "candidate", so once CI_MODEL_SMOKE_v1 (alphabetically before
      # MODEL_behavioral_default_v1) is also registered as a candidate,
      # the assertion fails on real content, not a code defect - confirmed
      # by direct reproduction (a real GitHub Actions run, 31206294665: PR
      # #2, SHA d6ae2ac) and locally, immediately after adding `--extra
      # dashboard` let this step run for the first time ever.
      - name: Model Lab - AppTest execution of the 9th dashboard page
        run: uv run pytest tests/test_dashboard_model_lab.py -q

      # Behavioral early-warning model (Phase 8): the same staged CLI a
      # human operator runs, on the real acquired UCI benchmark (fetched
      # above), under a CI-only experiment_id/model_id so it can never
      # collide with or overwrite the official EXP_behavioral_default_v1/
      # MODEL_behavioral_default_v1 committed to the repo.
      - name: Model - data audit and feature validation
        run: |
          uv run credlens model data-audit
          uv run credlens model validate-features

      - name: Model - train/evaluate/explain/audit-groups/stress-test (CI-scoped)
        run: |
          uv run credlens model create-split --experiment-id CI_MODEL_SMOKE --seed 42
          uv run credlens model train --experiment-id CI_MODEL_SMOKE --seed 42
          uv run credlens model evaluate --experiment-id CI_MODEL_SMOKE
          uv run credlens model compare --experiment-id CI_MODEL_SMOKE
          uv run credlens model explain --experiment-id CI_MODEL_SMOKE
          uv run credlens model audit-groups --experiment-id CI_MODEL_SMOKE
          uv run credlens model stress-test --experiment-id CI_MODEL_SMOKE

      - name: Model - register a candidate and validate it (leakage/gate checks)
        run: |
          uv run credlens model register --experiment-id CI_MODEL_SMOKE --model-id CI_MODEL_SMOKE_v1
          uv run credlens model validate --model-id CI_MODEL_SMOKE_v1

      - name: Model - batch scoring on a small sample of the real UCI schema
        run: |
          uv run python -c "
          import pandas as pd
          pd.read_csv('data/raw/uci_default_credit/default_of_credit_card_clients.csv').head(20).to_csv('/tmp/ci_model_batch_sample.csv', index=False)
          "
          uv run credlens model predict-batch --model-id CI_MODEL_SMOKE_v1 \
            --input /tmp/ci_model_batch_sample.csv --output /tmp/ci_model_batch_scored.csv
          test -s /tmp/ci_model_batch_scored.csv

      # Independent model validation (Phase 9, hardened Phase 10 gate B):
      # `--ci` uses the reduced permutation counts (99 for both controls,
      # not 999/100) - at n=99 the smallest achievable empirical p-value
      # is 1/100 = 0.01, which DOES satisfy `p <= alpha` at alpha=0.01, so
      # this is a real, unmasked gate, not a mathematically unwinnable
      # one (measured: 99 pipeline-retrain permutations cost well under 4
      # seconds). No `|| true` - a genuine validation_failed decision
      # must fail this job. Full-rigor validation (999/100 permutations)
      # is proven separately by tests/test_model_validation_*.py above and
      # the committed official decision.json (restored below).
      - name: Model validation - independent re-validation (CI-scoped permutation counts)
        run: |
          uv run credlens model validate-independent --model-id CI_MODEL_SMOKE_v1 --ci
          uv run credlens model audit-collinearity --model-id CI_MODEL_SMOKE_v1
          uv run credlens model audit-negative-controls --experiment-id CI_MODEL_SMOKE --ci

      - name: Model validation - challenger registration + Pareto comparison
        run: |
          uv run credlens model register-challenger --experiment-id CI_MODEL_SMOKE \
            --model-id CI_MODEL_SMOKE_challenger
          uv run credlens model compare-candidates --experiment-id CI_MODEL_SMOKE

      - name: Input contract - strict mode rejects an out-of-domain code (smoke)
        run: |
          uv run python -c "
          import pandas as pd
          from credlens.modeling.input_contract import InputContractError, validate_input_contract
          df = pd.read_csv('data/raw/uci_default_credit/default_of_credit_card_clients.csv').head(5)
          df.loc[df.index[0], 'X6'] = 15
          report = validate_input_contract(df, 'strict')
          assert report.n_quarantined_rows == 1
          try:
              validate_input_contract(df.drop(columns=['X6']), 'strict')
              raise SystemExit('strict mode should have rejected a missing column')
          except InputContractError:
              pass
          print('input contract strict-mode checks OK')
          "

      # Restorative step (shared-singleton-path tension: credlens.
      # model_validation.decision/report write to a SINGLE shared path,
      # not one keyed by experiment_id - the CI-scoped run above already
      # overwrote them with CI_MODEL_SMOKE content). decision.json/
      # validation_report.md(+pt-BR)/the permutation-control tables/the
      # null-distribution figure ARE fully deterministic given the
      # already-frozen EXP_behavioral_default_v1 experiment, confirmed by
      # byte-for-byte hash comparison across repeated local runs - so
      # re-running validate-independent against the OFFICIAL model
      # reproduces their exact committed content. The lifecycle file
      # (reports/model_validation/lifecycle/MODEL_behavioral_default_v1.
      # json) is the one genuine exception: it is an append-only audit
      # log stamped with `timestamp_utc`, so every invocation adds a new
      # entry by design - `git checkout --` (mirroring the official
      # EXP_behavioral_default_v1 retrain step above) restores it (and
      # guards the rest against any other non-determinism) without
      # relying on an assumption that doesn't hold for every file it
      # touches.
      - name: Model validation - restore the official decision/report
        run: |
          uv run credlens model validate-independent --model-id MODEL_behavioral_default_v1
          git checkout -- reports/modeling/ reports/model_validation/

      # `--untracked-files=no`: this job's own CI-scoped pipeline above
      # legitimately leaves plenty of untracked CI_MODEL_SMOKE* output
      # under these same two directories (models/experiments/tables/
      # figures/lifecycle - none of it gitignored, by design, since a
      # genuinely new OFFICIAL candidate must be free to land in these
      # same paths) - cleaned up in its own dedicated step further below,
      # not here. Confirmed by direct reproduction that a plain `git
      # status --porcelain` (no `--untracked-files=no`) sees those `??`
      # entries too and fails this check regardless of whether any
      # OFFICIAL/tracked artifact was actually altered - this check's own
      # purpose, scoped correctly.
      - name: Prove no official modeling/model_validation artifact was ever altered
        run: |
          git status --porcelain --untracked-files=no reports/modeling/ reports/model_validation/ \
            | tee ci_git_status_modeling.txt
          test ! -s ci_git_status_modeling.txt

      # Hands the CI-scoped registered candidate off to the `monitoring`
      # job - the one genuine cross-job dependency in this workflow
      # (monitoring needs an already-registered, already-frozen model to
      # build a reference against; duplicating the training sequence in
      # the monitoring job instead would waste CI minutes re-doing
      # identical work).
      - name: Upload the CI-scoped model/experiment artifacts for the monitoring job
        uses: actions/upload-artifact@v4
        with:
          name: ci-model-smoke-artifacts
          path: |
            reports/modeling/experiments/CI_MODEL_SMOKE*
            reports/modeling/models/CI_MODEL_SMOKE*
          retention-days: 1

  monitoring:
    name: Monitoring simulation (reference, batches, run, calibration, incidents)
    runs-on: ubuntu-latest
    needs: modeling-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --extra analysis --extra modeling --extra dashboard --python "3.11"

      - name: Download the CI-scoped model/experiment artifacts from modeling-validation
        uses: actions/download-artifact@v4
        with:
          name: ci-model-smoke-artifacts
          path: .

      # Fase 11C Gate H - this job is a fresh runner with no filesystem
      # shared with `modeling-validation` (only the small model/experiment
      # artifact above crosses that boundary): `data/raw/` is gitignored
      # (data/* - see .gitignore) and never committed, yet BOTH `credlens
      # monitor create-reference` below (-> credlens.monitoring.reference.
      # build_reference -> credlens.modeling.data.load_uci_default_credit)
      # AND every slow test in tests/test_monitoring_*.py that uses the
      # `phase9_isolated_repo_root` fixture (tests/conftest.py, which
      # copies data/raw/uci_default_credit/ from the real checkout) need
      # it on disk. Found by static audit (Fase 11C Gate H): this gap
      # predates this phase and was never observed on a real run because
      # `needs: modeling-validation` has kept this job from executing at
      # all while that job's own separate UCI-fetch-step issue is open -
      # see this phase's final report for the distinction between a
      # statically-found gap and a remotely-observed failure.
      - name: Fetch the UCI benchmark dataset
        run: uv run credlens data fetch --source uci-default-credit

      # Fase 11D - this job's own runner (separate from modeling-
      # validation's) also has none of the OFFICIAL EXP_behavioral_
      # default_v1's gitignored working artifacts (needed by tests/
      # test_cli_model_validation_monitor.py's `registered_throwaway_
      # model` fixture, which registers a NEW model_id against this
      # SAME already-trained experiment) nor the official monitoring
      # reference's population table (reports/monitoring/reference/
      # REF_MODEL_behavioral_default_v1__population.csv - gitignored,
      # needed by tests/test_monitoring_calibration_incidents_
      # detection.py). `credlens demo prepare --component monitoring`
      # (src/credlens/demo/factory.py, Fase 11C) reuses the existing
      # create-reference/calibrate/simulate-batches pipeline against the
      # already-committed, curated MODEL_behavioral_default_v1.joblib -
      # unrelated to the per-experiment retrain, but needs it done first
      # regardless for the CLI-registration test above. See the
      # modeling-validation job's identical retrain+restore step and
      # comment for why `git checkout --` runs immediately after.
      - name: Model - regenerate the official EXP_behavioral_default_v1 working artifacts
        run: |
          uv run credlens model train --experiment-id EXP_behavioral_default_v1 --seed 42
          uv run credlens model evaluate --experiment-id EXP_behavioral_default_v1
          uv run credlens model compare --experiment-id EXP_behavioral_default_v1
          uv run credlens model explain --experiment-id EXP_behavioral_default_v1
          uv run credlens model audit-groups --experiment-id EXP_behavioral_default_v1
          uv run credlens model stress-test --experiment-id EXP_behavioral_default_v1
          git checkout -- reports/modeling/ reports/model_validation/

      # `REF_MODEL_behavioral_default_v1.json`/`__alert_thresholds.json`
      # are still tracked (like the modeling experiment above, they
      # embed a `created_at_utc`/hash that a regeneration cannot
      # reproduce byte-for-byte) - `git checkout --` restores them,
      # leaving only the gitignored `__population.csv` this job's tests
      # actually need. Confirmed by direct reproduction that the tests
      # below never cross-check the restored reference's stored hash
      # against the freshly (re)generated population table's actual
      # content, so this mismatch is harmless in practice.
      #
      # --force is required: `REF_MODEL_behavioral_default_v1.json`
      # being tracked means it is ALWAYS present on any fresh checkout,
      # so the factory's own idempotency check always sees "a reference
      # already exists" and refuses without it - confirmed by direct
      # reproduction (the exact error without --force: "pass force=True
      # (CLI: --force) to regenerate it").
      - name: Monitoring - prepare the official reference (reused by the slow tests below)
        run: |
          uv run credlens demo prepare --component monitoring --force
          git checkout -- reports/monitoring/

      # Slow-marked monitoring integration tests, run once here.
      - name: Monitoring slow tests
        run: uv run pytest tests/test_monitoring_*.py tests/test_cli_model_validation_monitor.py -m slow -q

      # A SEPARATE reference/batch-set/run scoped to CI_MODEL_SMOKE_v1 -
      # reference_id/batch_set_id/run_id are all derived from this CI-only
      # model_id, so this can never collide with the official
      # REF_MODEL_behavioral_default_v1 reference (or its batch set/runs)
      # committed to the repo. All 12 batches (500 rows each, exactly
      # partitioning the 6,000-row locked test set) run in a few seconds.
      - name: Monitoring - create reference, calibrate family-wise threshold, simulate batches, run
        run: |
          uv run credlens monitor create-reference --model-id CI_MODEL_SMOKE_v1 --json > ci_monitor_ref.json
          REFERENCE_ID=$(uv run python -c "import json; print(json.load(open('ci_monitor_ref.json'))['reference_id'])")
          uv run credlens monitor calibrate-reference --reference-id "$REFERENCE_ID"
          uv run credlens monitor simulate-batches --reference-id "$REFERENCE_ID" --json > ci_monitor_batches.json
          BATCH_SET_ID=$(uv run python -c "import json; print(json.load(open('ci_monitor_batches.json'))['batch_set_id'])")
          uv run credlens monitor run --reference-id "$REFERENCE_ID" --batch-set "$BATCH_SET_ID" --json > ci_monitor_run.json
          RUN_ID=$(uv run python -c "import json; print(json.load(open('ci_monitor_run.json'))['run_id'])")
          echo "CI_MONITOR_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "CI_MONITOR_REFERENCE_ID=$REFERENCE_ID" >> "$GITHUB_ENV"

      - name: Monitoring - status, alerts, validate, detection evaluation (Phase 10 gates F/G/H)
        run: |
          uv run credlens monitor status --run-id "$CI_MONITOR_RUN_ID"
          uv run credlens monitor alerts --run-id "$CI_MONITOR_RUN_ID"
          uv run credlens monitor validate --run-id "$CI_MONITOR_RUN_ID"
          uv run credlens monitor evaluate-detection --reference-id "$CI_MONITOR_REFERENCE_ID"

      - name: Model Monitoring Lab - AppTest execution of the 10th dashboard page
        run: uv run pytest tests/test_dashboard_monitoring_lab.py -q

      - name: Model - clean up the CI-scoped experiment/model (never committed)
        run: |
          rm -rf reports/modeling/experiments/CI_MODEL_SMOKE* \
                 reports/modeling/models/CI_MODEL_SMOKE_v1* \
                 reports/modeling/models/CI_MODEL_SMOKE_challenger* \
                 reports/modeling/tables/CI_MODEL_SMOKE__* \
                 reports/modeling/figures/CI_MODEL_SMOKE__* \
                 reports/model_validation/tables/CI_MODEL_SMOKE__* \
                 reports/model_validation/lifecycle/CI_MODEL_SMOKE* \
                 reports/monitoring/reference/REF_CI_MODEL_SMOKE_v1* \
                 reports/monitoring/runs/BATCHSET_REF_CI_MODEL_SMOKE_v1* \
                 reports/monitoring/runs/RUN_BATCHSET_REF_CI_MODEL_SMOKE_v1_* \
                 reports/monitoring/alerts/RUN_BATCHSET_REF_CI_MODEL_SMOKE_v1_*.json \
                 ci_monitor_ref.json ci_monitor_batches.json ci_monitor_run.json

      - name: Prove no official monitoring/ artifact was ever altered
        run: |
          git status --porcelain reports/monitoring/ | tee ci_git_status_monitoring.txt
          test ! -s ci_git_status_monitoring.txt

  release-integrity:
    name: Release integrity (workflow safety, licenses, secrets, lockfile)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --extra warehouse --extra analysis --extra dashboard --extra modeling --python "3.11"

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Release CLI checks (validate/licenses/sbom/manifest/status)
        run: |
          uv run credlens release validate --json
          uv run credlens release licenses --json > /dev/null
          uv run credlens release sbom --json > /dev/null
          uv run credlens release manifest --json > /dev/null
          uv run credlens release status

  # A single required check other branch-protection rules can point at,
  # without needing to list every parallel job by name (and without
  # `|| true` - if any dependency failed, this job is skipped, and a
  # skipped required job still blocks a PR from merging).
  ci-summary:
    name: CI summary (all jobs passed)
    runs-on: ubuntu-latest
    needs:
      - quality
      - unit-tests
      - warehouse-integration
      - analytics-dashboard
      - modeling-validation
      - monitoring
      - release-integrity
    steps:
      - name: All required jobs succeeded
        run: echo "All CI jobs passed."
