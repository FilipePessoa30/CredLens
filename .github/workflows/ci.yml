name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-groups --extra warehouse --extra analysis --extra dashboard \
            --extra notebook --extra modeling --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src tests dashboard

      # Every generation-related test in this suite runs at 'smoke' scale
      # (a few hundred customers, well under a second) or, for Monte Carlo
      # tests, 2 seeds at 'smoke' scale - 'sample'/'portfolio' scale and any
      # wide Monte Carlo sweep are never run in CI (Phase 4B section 19).
      # Phase 8's `slow`-marked tests (tests/test_modeling_reporting.py,
      # test_cli_model.py) run the full staged modeling pipeline on the
      # real 30,000-row UCI benchmark and are NOT excluded here - unlike
      # the synthetic generator, this pipeline's tuning grid (4 + 4
      # combinations) and bootstrap (1,000 resamples on a 6,000-row test
      # set) were sized to be CI-appropriate from the start (Phase 8
      # section 12: "não execute busca enorme"), so there is no separate
      # reduced-scale mode to switch to - running the real thing here IS
      # the smoke path. Combined they add well under two minutes.
      - name: Test with coverage (pytest)
        run: uv run pytest --cov=credlens --cov-report=term-missing

      - name: CLI smoke check
        run: uv run credlens doctor

      # Warehouse validation (Phase 5): generates a single deterministic
      # 'smoke'-scale run (a few hundred customers, well under a second -
      # never 'sample'/'portfolio' scale in CI), then exercises the full
      # credlens warehouse pipeline against it. `credlens warehouse build`
      # itself invokes dbt-core's dbtRunner, which parses the project
      # before running it - a separate `dbt parse` step would be
      # redundant, so a failed parse surfaces here as a failed build.
      - name: Generate a deterministic smoke run for warehouse validation
        run: |
          uv run credlens synthetic generate --scenario baseline --scale smoke --seed 2026 --force \
            | tee generate_output.txt
          RUN_ID=$(grep '^generation_run_id:' generate_output.txt | awk '{print $2}')
          echo "WAREHOUSE_CI_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Warehouse build (dbt parse + run + generic/singular tests)
        run: |
          uv run credlens warehouse build \
            --run-id "$WAREHOUSE_CI_RUN_ID" --build-id CI_WAREHOUSE_BUILD --force

      - name: Warehouse test (re-run dbt tests, no rebuild)
        run: uv run credlens warehouse test --build-id CI_WAREHOUSE_BUILD

      - name: Warehouse independent Python reconciliation
        run: uv run credlens warehouse reconcile --build-id CI_WAREHOUSE_BUILD

      - name: Warehouse CLI smoke checks (status/query/docs)
        run: |
          uv run credlens warehouse status --build-id CI_WAREHOUSE_BUILD
          uv run credlens warehouse query --build-id CI_WAREHOUSE_BUILD --name portfolio_monthly
          uv run credlens warehouse docs --build-id CI_WAREHOUSE_BUILD

      # Portfolio analysis layer (Phase 6): the analysis CLI needs a SUITE
      # (baseline + every CRN scenario), not a single run, to compare
      # scenarios - a separate smoke-scale suite build from the warehouse
      # steps above. Multi-seed robustness (--multiseed) is intentionally
      # NOT run here - it performs real additional data generation and is
      # explicitly out of scope for CI (Phase 6 section 22); it is proven
      # once, deterministically, by tests/test_analysis_runner.py instead.
      # The benchmark appendix is also skipped (--no-benchmark): the public
      # datasets it profiles live under the gitignored data/raw/ and are
      # never fetched in CI (no external downloads, Phase 6 section 22) -
      # tests/test_analysis_benchmark.py already proves the appendix
      # degrades to "not included" gracefully when its files are absent.
      - name: Generate a deterministic smoke suite for analysis validation
        run: uv run credlens synthetic generate-suite --scale smoke --seed 900001 --force

      - name: Analysis warehouse build (dbt build against the smoke suite)
        run: |
          uv run credlens warehouse build \
            --suite-id SUITE_smoke_900001 --build-id CI_ANALYSIS_BUILD --force

      - name: Analysis validate (no full run)
        run: uv run credlens analysis validate --build-id CI_ANALYSIS_BUILD

      - name: Analysis run (smoke scale, no benchmark, CI-scoped output dir)
        run: |
          uv run credlens analysis run --build-id CI_ANALYSIS_BUILD \
            --output-dir /tmp/ci_portfolio_analysis --no-benchmark --insights

      - name: Validate analysis outputs were really written
        run: |
          test -s /tmp/ci_portfolio_analysis/manifest.json
          test -s /tmp/ci_portfolio_analysis/executive_summary.md
          test -s /tmp/ci_portfolio_analysis/executive_summary.pt-BR.md
          test -s /tmp/ci_portfolio_analysis/technical_report.md
          test -s /tmp/ci_portfolio_analysis/technical_report.pt-BR.md
          test -s /tmp/ci_portfolio_analysis/insights.yml
          FIGURE_COUNT=$(find /tmp/ci_portfolio_analysis/figures -name '*.png' | wc -l)
          echo "Generated $FIGURE_COUNT figures"
          test "$FIGURE_COUNT" -ge 8
          uv run python -c "
          import json
          m = json.load(open('/tmp/ci_portfolio_analysis/manifest.json'))
          assert m['final_status'] == 'success', m['final_status']
          assert not m['warnings'], m['warnings']
          "

      - name: Analysis CLI smoke checks (scenarios/status/benchmark)
        run: |
          uv run credlens analysis scenarios --build-id CI_ANALYSIS_BUILD
          uv run credlens analysis status --output-dir /tmp/ci_portfolio_analysis
          uv run credlens analysis benchmark

      - name: Analysis reproduce (idempotency proof)
        run: |
          uv run credlens analysis reproduce --output-dir /tmp/ci_portfolio_analysis \
            --reproduce-dir /tmp/ci_portfolio_analysis_reproduce --json

      # Notebook (Phase 7): executes the case-study notebook end to end in
      # a real Jupyter kernel against the committed, versioned
      # reports/portfolio_analysis/ - never data/warehouse/ or any CI-only
      # scratch build (the notebook's own relative paths only ever look at
      # the checked-in reports/ tree). Output goes to a scratch path
      # outside the repo, so this can never touch tracked files.
      - name: Notebook - execute end to end in a real kernel
        run: |
          uv run jupyter nbconvert --to notebook --execute \
            notebooks/credit_portfolio_case_study.ipynb \
            --output /tmp/ci_notebook_executed.ipynb \
            --ExecutePreprocessor.timeout=120

      # Decision Intelligence Dashboard (Phase 7): validates both a real
      # build and a demo package exported from it, then drives every one
      # of the 8 pages through streamlit.testing.v1.AppTest in both modes
      # - the strongest verification available without a browser (this CI
      # image has no browser-automation tool, Phase 7 section 21). Never
      # portfolio scale, never a heavy browser test, per section 24.
      - name: Dashboard - export demo package from the CI analysis build
        run: |
          uv run credlens dashboard export-demo --build-id CI_ANALYSIS_BUILD \
            --analysis-output-dir /tmp/ci_portfolio_analysis \
            --output-dir /tmp/ci_dashboard_demo

      - name: Dashboard - validate the build and the demo package
        run: |
          uv run credlens dashboard validate --build-id CI_ANALYSIS_BUILD
          uv run credlens dashboard validate --demo --demo-data-dir /tmp/ci_dashboard_demo

      - name: Dashboard - AppTest execution of all 8 pages (demo + warehouse mode)
        env:
          CREDLENS_TEST_DEMO_DATA_DIR: /tmp/ci_dashboard_demo
          CREDLENS_TEST_BUILD_ID: CI_ANALYSIS_BUILD
        run: uv run pytest tests/test_dashboard_apptest.py -q

      # Behavioral early-warning model (Phase 8): the same staged CLI a
      # human operator runs, on the real acquired UCI benchmark (already
      # on disk, never downloaded here), under a CI-only experiment_id/
      # model_id so it can never collide with or overwrite the official
      # EXP_behavioral_default_v1/MODEL_behavioral_default_v1 committed to
      # the repo. `report`/figure generation is intentionally skipped here
      # - those write to the single, top-level reports/modeling/model_card
      # .md et al., which the official experiment already owns; the
      # pytest step above already proves report/figure generation works,
      # on its own isolated repo copy.
      - name: Model - data audit and feature validation
        run: |
          uv run credlens model data-audit
          uv run credlens model validate-features

      - name: Model - train/evaluate/explain/audit-groups/stress-test (CI-scoped)
        run: |
          uv run credlens model create-split --experiment-id CI_MODEL_SMOKE --seed 42
          uv run credlens model train --experiment-id CI_MODEL_SMOKE --seed 42
          uv run credlens model evaluate --experiment-id CI_MODEL_SMOKE
          uv run credlens model compare --experiment-id CI_MODEL_SMOKE
          uv run credlens model explain --experiment-id CI_MODEL_SMOKE
          uv run credlens model audit-groups --experiment-id CI_MODEL_SMOKE
          uv run credlens model stress-test --experiment-id CI_MODEL_SMOKE

      - name: Model - register a candidate and validate it (leakage/gate checks)
        run: |
          uv run credlens model register --experiment-id CI_MODEL_SMOKE --model-id CI_MODEL_SMOKE_v1
          uv run credlens model validate --model-id CI_MODEL_SMOKE_v1

      - name: Model - batch scoring on a small sample of the real UCI schema
        run: |
          uv run python -c "
          import pandas as pd
          pd.read_csv('data/raw/uci_default_credit/default_of_credit_card_clients.csv').head(20).to_csv('/tmp/ci_model_batch_sample.csv', index=False)
          "
          uv run credlens model predict-batch --model-id CI_MODEL_SMOKE_v1 \
            --input /tmp/ci_model_batch_sample.csv --output /tmp/ci_model_batch_scored.csv
          test -s /tmp/ci_model_batch_scored.csv

      - name: Model Lab - AppTest execution of the 9th dashboard page
        run: uv run pytest tests/test_dashboard_model_lab.py -q

      # Independent model validation (Phase 9): the same CI-scoped
      # CI_MODEL_SMOKE_v1 candidate from the Phase 8 steps above, run
      # through credlens.model_validation. `--ci` uses the reduced
      # permutation count (10, not 100) - with alpha=0.01 the smallest
      # achievable empirical p-value at n=10 is 1/11 ~ 0.09, so the
      # negative_controls gate (and therefore the overall decision)
      # CANNOT mathematically pass at this scale - this step proves the
      # pipeline RUNS end to end without error, not that it passes; full-
      # rigor validation (100 permutations) is proven separately by
      # tests/test_model_validation_*.py and the committed official
      # decision.json (see the restorative step below for why decision
      # .json/validation_report.md are regenerated one final time here).
      - name: Model validation - independent re-validation (CI-scoped, reduced permutations)
        run: |
          uv run credlens model validate-independent --model-id CI_MODEL_SMOKE_v1 --ci || true
          uv run credlens model audit-collinearity --model-id CI_MODEL_SMOKE_v1
          uv run credlens model audit-negative-controls --experiment-id CI_MODEL_SMOKE --ci

      - name: Model validation - challenger registration + Pareto comparison
        run: |
          uv run credlens model register-challenger --experiment-id CI_MODEL_SMOKE \
            --model-id CI_MODEL_SMOKE_challenger
          uv run credlens model compare-candidates --experiment-id CI_MODEL_SMOKE

      - name: Input contract - strict mode rejects an out-of-domain code (smoke)
        run: |
          uv run python -c "
          import pandas as pd
          from credlens.modeling.input_contract import InputContractError, validate_input_contract
          df = pd.read_csv('data/raw/uci_default_credit/default_of_credit_card_clients.csv').head(5)
          df.loc[df.index[0], 'X6'] = 15
          report = validate_input_contract(df, 'strict')
          assert report.n_quarantined_rows == 1
          try:
              validate_input_contract(df.drop(columns=['X6']), 'strict')
              raise SystemExit('strict mode should have rejected a missing column')
          except InputContractError:
              pass
          print('input contract strict-mode checks OK')
          "

      # Monitoring simulation (Phase 9): a SEPARATE reference/batch-set/run
      # scoped to CI_MODEL_SMOKE_v1 - reference_id/batch_set_id/run_id are
      # all derived from this CI-only model_id, so this can never collide
      # with the official REF_MODEL_behavioral_default_v1 reference (or
      # its batch set/runs) committed to the repo. All 12 batches (500
      # rows each, exactly partitioning the 6,000-row locked test set)
      # run in a few seconds - there is no separate "smaller" batch
      # config to switch to for CI (Phase 9 section 26: "batches
      # pequenos" - 500 rows/batch already qualifies as small and fast).
      - name: Monitoring - create reference, simulate batches, run
        run: |
          uv run credlens monitor create-reference --model-id CI_MODEL_SMOKE_v1 --json > ci_monitor_ref.json
          REFERENCE_ID=$(uv run python -c "import json; print(json.load(open('ci_monitor_ref.json'))['reference_id'])")
          uv run credlens monitor simulate-batches --reference-id "$REFERENCE_ID" --json > ci_monitor_batches.json
          BATCH_SET_ID=$(uv run python -c "import json; print(json.load(open('ci_monitor_batches.json'))['batch_set_id'])")
          uv run credlens monitor run --reference-id "$REFERENCE_ID" --batch-set "$BATCH_SET_ID" --json > ci_monitor_run.json
          RUN_ID=$(uv run python -c "import json; print(json.load(open('ci_monitor_run.json'))['run_id'])")
          echo "CI_MONITOR_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Monitoring - status, alerts, validate (no report - see cleanup note below)
        run: |
          uv run credlens monitor status --run-id "$CI_MONITOR_RUN_ID"
          uv run credlens monitor alerts --run-id "$CI_MONITOR_RUN_ID"
          uv run credlens monitor validate --run-id "$CI_MONITOR_RUN_ID"

      - name: Model Monitoring Lab - AppTest execution of the 10th dashboard page
        run: uv run pytest tests/test_dashboard_monitoring_lab.py -q

      - name: Model - clean up the CI-scoped experiment/model (never committed)
        run: |
          rm -rf reports/modeling/experiments/CI_MODEL_SMOKE* \
                 reports/modeling/models/CI_MODEL_SMOKE_v1* \
                 reports/modeling/models/CI_MODEL_SMOKE_challenger* \
                 reports/modeling/tables/CI_MODEL_SMOKE__* \
                 reports/modeling/figures/CI_MODEL_SMOKE__* \
                 reports/model_validation/tables/CI_MODEL_SMOKE__* \
                 reports/model_validation/lifecycle/CI_MODEL_SMOKE* \
                 reports/monitoring/reference/REF_CI_MODEL_SMOKE_v1* \
                 reports/monitoring/runs/BATCHSET_REF_CI_MODEL_SMOKE_v1* \
                 reports/monitoring/runs/RUN_BATCHSET_REF_CI_MODEL_SMOKE_v1_* \
                 reports/monitoring/alerts/RUN_BATCHSET_REF_CI_MODEL_SMOKE_v1_*.json \
                 ci_monitor_ref.json ci_monitor_batches.json ci_monitor_run.json

      # Restorative step (same tension, same fix as Phase 8's model_card
      # clobbering note): credlens.model_validation.decision/report write
      # to a SINGLE shared path (reports/model_validation/decision.json,
      # validation_report.md/.pt-BR.md), not one keyed by experiment_id -
      # the CI-scoped run above already overwrote them with
      # CI_MODEL_SMOKE content. Both are fully deterministic (no
      # timestamp field), so re-running validate-independent against the
      # OFFICIAL model reproduces the exact committed content - unlike
      # model cards, this is a real fix, not just a risk reduction.
      - name: Model validation - restore the official decision/report
        run: uv run credlens model validate-independent --model-id MODEL_behavioral_default_v1

      # Runs LAST so it also covers every step above (notebook execution,
      # dashboard demo export/validate/AppTest, the modeling CLI smoke
      # sequence, independent validation, challenger registration,
      # monitoring simulation) - none of them may modify a tracked,
      # official artifact.
      - name: Prove no official artifact was ever altered
        run: |
          git status --porcelain reports/portfolio_analysis/ reports/modeling/ analysis/ warehouse/ \
            reports/model_validation/ reports/monitoring/ \
            | tee ci_git_status.txt
          test ! -s ci_git_status.txt
