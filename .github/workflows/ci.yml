name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src tests

      # Every generation-related test in this suite runs at 'smoke' scale
      # (a few hundred customers, well under a second) or, for Monte Carlo
      # tests, 2 seeds at 'smoke' scale - 'sample'/'portfolio' scale and any
      # wide Monte Carlo sweep are never run in CI (Phase 4B section 19).
      - name: Test with coverage (pytest)
        run: uv run pytest --cov=credlens --cov-report=term-missing

      - name: CLI smoke check
        run: uv run credlens doctor
